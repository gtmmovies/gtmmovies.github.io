<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTM ADMIN V9 - افلام ومسلسلات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#08080a;color:#fff;padding:20px}
h1{font-size:28px;margin-bottom:20px}.red{color:#e50914}
.card{background:#121218;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:18px;margin-bottom:16px}
label{font-size:13px;color:#aaa;margin-bottom:6px;display:block;font-weight:700}
input,textarea,select{width:100%;background:#1a1a22;border:1px solid rgba(255,255,255,.12);border-radius:10px;color:#fff;padding:12px 14px;outline:none;margin-bottom:12px;font-size:14px}
input:focus,textarea:focus,select:focus{border-color:#e50914}
textarea{resize:vertical;min-height:80px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.typeSel{display:flex;gap:10px;margin-bottom:14px}
.typeBtn{flex:1;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#fff;font-weight:900;cursor:pointer;text-align:center;transition:.2s}
.typeBtn.active{background:#e50914;border-color:#e50914}
.epBox{background:#0e0e13;border:1px dashed rgba(255,255,255,.15);border-radius:12px;padding:12px;margin-top:10px}
.epItem{background:#1a1a24;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px;margin-bottom:10px;position:relative}
.epItem h4{font-size:13px;margin-bottom:8px;color:#e50914}
.delEp{position:absolute;top:8px;left:8px;background:#e50914;color:#fff;border:0;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px}
.btn{padding:12px 20px;border-radius:10px;border:0;font-weight:900;cursor:pointer;transition:.2s}
.btn-add{background:#1e8fff;color:#fff;width:100%;margin-top:8px}
.btn-save{background:#e50914;color:#fff;font-size:16px;width:100%;padding:16px}
.btn-small{background:rgba(255,255,255,.1);color:#fff}
.list{margin-top:20px}
.movieRow{display:flex;gap:10px;align-items:center;background:#121218;border:1px solid rgba(255,255,255,.07);padding:10px;border-radius:10px;margin-bottom:8px}
.movieRow img{width:45px;height:65px;object-fit:cover;border-radius:6px}
.mTitle{flex:1;font-size:13px}
.mActions{display:flex;gap:6px}
.smallBtn{padding:6px 10px;border-radius:6px;border:0;font-size:12px;cursor:pointer}
.edit{background:#1e8fff;color:#fff}.delete{background:#e50914;color:#fff}
</style>
</head>
<body>
<h1><span class="red">GTM</span> ADMIN V9</h1>

<div class="card">
 <label>نوع المحتوى</label>
 <div class="typeSel">
  <div class="typeBtn active" id="btnMovie" onclick="setType('movie')">🎬 فيلم</div>
  <div class="typeBtn" id="btnSeries" onclick="setType('series')">📺 مسلسل</div>
 </div>

 <label>اسم الفيلم / المسلسل</label>
 <input id="title" placeholder="مثال: خلي بالك من نفسك">

 <div class="row">
  <div><label>السنة</label><input id="year" placeholder="2025"></div>
  <div><label>التصنيف (افصل بفاصلة)</label><input id="category" placeholder="اكشن, دراما, مسلسلات عربي"></div>
 </div>

 <label>صورة البوستر - رابط مباشر</label>
 <input id="poster" placeholder="https://...jpg">

 <label>الوصف</label>
 <textarea id="desc" placeholder="قصة الفيلم..."></textarea>

 <div id="movieFields">
  <label>🎬 سيرفر المشاهدة 1</label>
  <input id="video_url" placeholder="https://...">
  <label>🎬 سيرفر المشاهدة 2 (اختياري)</label>
  <input id="video_url2" placeholder="https://...">
  <label>⬇ رابط التحميل (اختياري)</label>
  <input id="download_url" placeholder="https://...">
 </div>

 <div id="seriesFields" style="display:none">
  <div style="background:rgba(229,9,20,.1);border:1px solid rgba(229,9,20,.2);border-radius:10px;padding:10px;margin-bottom:10px;font-size:12px;color:#ff7a8a">
   💡 ضيف كل حلقة بالسيرفرات بتاعتها. مثال: الحلقة 1 - سيرفر 1 و سيرفر 2
  </div>
  <div class="epBox" id="epContainer"></div>
  <button class="btn btn-add" onclick="addEpisode()">+ اضافة حلقة جديدة</button>
  <div style="margin-top:12px">
   <label>⬇ رابط تحميل المسلسل كامل (اختياري)</label>
   <input id="series_download" placeholder="https://...">
  </div>
 </div>

 <button class="btn btn-save" style="margin-top:16px" onclick="saveMovie()">💾 حفظ</button>
 <button class="btn btn-small" style="width:100%;margin-top:8px" onclick="clearForm()">مسح الفورم</button>
</div>

<div class="card">
 <label>البحث في الأفلام</label>
 <input id="searchList" placeholder="ابحث..." oninput="renderList()">
 <div class="list" id="movieList"></div>
 <button class="btn btn-small" style="width:100%;margin-top:10px" onclick="downloadJSON()">⬇ تحميل movies.json</button>
</div>

<script>
let movies=[];
let editId=null;
let currentType='movie';
let episodes=[];

function setType(t){
 currentType=t;
 document.getElementById('btnMovie').classList.toggle('active',t=='movie');
 document.getElementById('btnSeries').classList.toggle('active',t=='series');
 document.getElementById('movieFields').style.display=t=='movie'?'block':'none';
 document.getElementById('seriesFields').style.display=t=='series'?'block':'none';
}

function addEpisode(data=null){
 let num=episodes.length+1;
 let ep=data||{num:num,title:`الحلقة ${num}`,video_url:'',video_url2:''};
 episodes.push(ep);
 renderEpisodes();
}

function renderEpisodes(){
 document.getElementById('epContainer').innerHTML=episodes.map((ep,i)=>`
  <div class="epItem">
   <button class="delEp" onclick="removeEp(${i})">حذف</button>
   <h4>الحلقة ${i+1}</h4>
   <div class="row">
    <div><label>عنوان الحلقة</label><input value="${ep.title}" oninput="episodes[${i}].title=this.value" placeholder="الحلقة ${i+1}"></div>
    <div><label>رقم الحلقة</label><input type="number" value="${ep.num||i+1}" oninput="episodes[${i}].num=this.value"></div>
   </div>
   <label>سيرفر 1 - الحلقة ${i+1}</label>
   <input value="${ep.video_url||''}" oninput="episodes[${i}].video_url=this.value" placeholder="https://...">
   <label>سيرفر 2 - الحلقة ${i+1} (اختياري)</label>
   <input value="${ep.video_url2||''}" oninput="episodes[${i}].video_url2=this.value" placeholder="https://...">
  </div>
 `).join('');
}

function removeEp(i){episodes.splice(i,1);renderEpisodes();}

async function loadJSON(){
 try{
  let r=await fetch('./movies.json?v='+Date.now(),{cache:'no-store'});
  if(r.ok){let j=await r.json();movies=Array.isArray(j)?j:j.movies||[];renderList();}
 }catch(e){}
}
function renderList(){
 let q=(document.getElementById('searchList').value||'').toLowerCase();
 let list=q?movies.filter(m=>(m.title||'').toLowerCase().includes(q)):movies;
 document.getElementById('movieList').innerHTML=list.slice(0,50).map(m=>`
  <div class="movieRow">
   <img src="${m.poster_url||m.poster||''}" onerror="this.src='https://via.placeholder.com/45x65'">
   <div class="mTitle">${m.title} <br><small style="color:#888">${(m.category||'')}${m.episodes?' • 📺 '+m.episodes.length+' حلقة':''}</small></div>
   <div class="mActions">
    <button class="smallBtn edit" onclick="editMovie('${m.id}')">تعديل</button>
    <button class="smallBtn delete" onclick="deleteMovie('${m.id}')">حذف</button>
   </div>
  </div>
 `).join('');
}
function editMovie(id){
 let m=movies.find(x=>String(x.id)==String(id));
 if(!m)return;
 editId=id;
 document.getElementById('title').value=m.title||'';
 document.getElementById('year').value=m.year||'';
 document.getElementById('category').value=m.category||'';
 document.getElementById('poster').value=m.poster_url||m.poster||'';
 document.getElementById('desc').value=m.description||'';
 if(m.episodes && m.episodes.length>0){
  setType('series');
  episodes=m.episodes.map(e=>({...e}));
  renderEpisodes();
  document.getElementById('series_download').value=m.download_url||'';
 }else{
  setType('movie');
  document.getElementById('video_url').value=m.video_url||'';
  document.getElementById('video_url2').value=m.video_url2||'';
  document.getElementById('download_url').value=m.download_url||'';
 }
 window.scrollTo({top:0,behavior:'smooth'});
}
function deleteMovie(id){
 if(!confirm('حذف؟'))return;
 movies=movies.filter(x=>String(x.id)!=String(id));
 renderList();
}
function clearForm(){
 editId=null;
 document.getElementById('title').value='';document.getElementById('year').value='';document.getElementById('category').value='';
 document.getElementById('poster').value='';document.getElementById('desc').value='';
 document.getElementById('video_url').value='';document.getElementById('video_url2').value='';document.getElementById('download_url').value='';
 document.getElementById('series_download').value='';episodes=[];renderEpisodes();setType('movie');
}
function saveMovie(){
 let title=document.getElementById('title').value.trim();
 if(!title){alert('اكتب الاسم');return;}
 let base={
  id:editId||Date.now().toString(),
  title:title,
  year:document.getElementById('year').value.trim(),
  category:document.getElementById('category').value.trim()||'افلام',
  poster_url:document.getElementById('poster').value.trim(),
  poster:document.getElementById('poster').value.trim(),
  description:document.getElementById('desc').value.trim(),
 };
 if(currentType=='movie'){
  base.video_url=document.getElementById('video_url').value.trim();
  base.video_url2=document.getElementById('video_url2').value.trim();
  base.download_url=document.getElementById('download_url').value.trim();
  base.type='movie';
 }else{
  if(episodes.length==0){alert('ضيف حلقة واحدة على الاقل');return;}
  // نظف الحلقات الفاضية
  base.episodes=episodes.filter(e=>e.video_url).map((e,i)=>({num:parseInt(e.num)||i+1,title:e.title||`الحلقة ${i+1}`,video_url:e.video_url,video_url2:e.video_url2||''}));
  base.download_url=document.getElementById('series_download').value.trim();
  base.type='series';
  // للتوافق: اول حلقة تبقى video_url الرئيسي
  base.video_url=base.episodes[0]?.video_url||'';
  base.video_url2=base.episodes[0]?.video_url2||'';
 }
 if(editId){
  let idx=movies.findIndex(x=>String(x.id)==String(editId));
  if(idx>=0) movies[idx]=base; else movies.unshift(base);
 }else{
  movies.unshift(base);
 }
 editId=null;
 renderList();
 clearForm();
 alert('تم الحفظ! دوس تحميل movies.json وارفعه على GitHub');
}
function downloadJSON(){
 let blob=new Blob([JSON.stringify(movies,null,2)],{type:'application/json'});
 let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='movies.json';a.click();
}
loadJSON();
renderEpisodes();
</script>
</body>
</html>
