<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTM - V3 FAST</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{font-family:'Cairo',sans-serif;box-sizing:border-box}
body{margin:0;background:#060606;color:#fff}
.topbar{height:64px;background:#0e0e0e;border-bottom:1px solid #1f1f1f;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{position:relative;background:#121212;border:1px solid #1f1f1f;border-radius:16px;overflow:hidden}
.card:hover{border-color:#e50914}
.card img{width:100%;height:260px;object-fit:cover}
.card-body{padding:10px}
.card-actions{position:absolute;top:8px;left:8px;display:flex;gap:6px;opacity:1;z-index:10}
.icon-btn{width:32px;height:32px;border-radius:8px;border:none;cursor:pointer;background:rgba(0,0,0,.85);color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:200;padding:15px}
.modal.active{display:flex}
.modal-box{background:#111;border:1px solid #222;border-radius:20px;width:100%;max-width:500px;max-height:90vh;overflow:auto;padding:20px}
.modal-box input,.modal-box select,.modal-box textarea{width:100%;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:12px;margin:7px 0;color:#fff}
.btn-save{width:100%;background:#e50914;border:none;padding:14px;border-radius:12px;color:#fff;font-weight:800;font-size:16px;margin-top:10px;cursor:pointer}
.btn-save:disabled{background:#444}
</style>
</head>
<body>
<div class="topbar">
<div style="font-weight:800">GTM <span style="color:#e50914">V3 FAST</span></div>
<button style="background:#e50914;color:#fff;border:none;padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:700" onclick="openModal()">+ إضافة فيلم</button>
</div>
<div style="max-width:1100px;margin:20px auto;padding:0 20px">
<input style="width:100%;background:#161616;border:1px solid #222;border-radius:12px;padding:12px;color:#fff" id="search" placeholder="🔍 بحث..." oninput="filterMovies()">
<div style="margin-top:15px;display:flex;gap:8px"><input id="ghToken" type="password" placeholder="توكن GitHub" style="flex:1;background:#111;border:1px solid #222;border-radius:10px;padding:10px;color:#fff"><button onclick="localStorage.setItem('gh_token',ghToken.value);alert('تم')" style="background:#222;color:#fff;border:none;border-radius:8px;padding:8px 12px">حفظ</button></div>
<div class="grid" id="list" style="margin-top:20px"></div>
</div>
<div class="modal" id="modal">
<div class="modal-box">
<div style="display:flex;justify-content:space-between"><h3>إضافة فيلم</h3><button onclick="closeModal()" style="background:#222;border:none;color:#fff;width:32px;height:32px;border-radius:8px">✕</button></div>
<input id="title" placeholder="اسم الفيلم">
<input id="year" placeholder="السنة">
<select id="category"><option>افلام عربي</option><option>افلام اجنبي</option><option>اكشن</option><option>كوميدي</option><option>رعب</option><option>دراما</option></select>
<input type="file" id="file" accept="image/*"><img id="preview" style="width:100%;display:none;margin-top:10px;border-radius:10px">
<input id="video" placeholder="رابط المشاهدة">
<textarea id="desc" placeholder="القصة" rows="3"></textarea>
<input type="hidden" id="editId">
<button class="btn-save" id="saveBtn" onclick="save()">حفظ ونشر 🚀</button>
<div id="msg" style="font-size:12px;margin-top:8px"></div>
</div>
</div>
<script>
const supa=supabase.createClient('https://akkroydgqotbavvchiju.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFra3JveWRncW90YmF2dmNoaWp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MjY2MDcsImV4cCI6MjEwMjAwMjYwN30.lP10UuBAudqfOeoSpOkfHOXMR1Z24kY68CRNmKUcXpo');
let allData=[], selectedFile=null;
const REPO_OWNER='gtmmovies', REPO_NAME='gtmmovies.github.io', FILE_PATH='movies.json';
ghToken.value=localStorage.getItem('gh_token')||'';
function openModal(){modal.classList.add('active')}function closeModal(){modal.classList.remove('active')}
file.addEventListener('change',()=>{selectedFile=file.files[0];let r=new FileReader();r.onload=e=>{preview.src=e.target.result;preview.style.display='block'};r.readAsDataURL(selectedFile)});
async function uploadPoster(){if(!selectedFile) return window.oldPoster;let fileName=Date.now()+'.jpg';let {error}=await supa.storage.from('posters').upload(fileName,selectedFile);if(error) throw error;let {data}=supa.storage.from('posters').getPublicUrl(fileName);return data.publicUrl;}
async function updateGitHubJson(){let token=localStorage.getItem('gh_token');let {data}=await supa.from('movies').select('*').order('id',{ascending:false});let b64=btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));let getRes=await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`,{headers:{Authorization:`Bearer ${token}`}});let sha=null;if(getRes.ok){let j=await getRes.json();sha=j.sha}let putRes=await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`,{method:'PUT',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({message:'update',content:b64,sha})});if(!putRes.ok) throw new Error('فشل GitHub')}
let isSaving=false;
async function save(){if(isSaving) return;isSaving=true;let btn=saveBtn;btn.disabled=true;btn.innerText='⏳ بيرفع...';try{let posterUrl=await uploadPoster();let payload={title:title.value,year:year.value,category:category.value,poster_url:posterUrl,video_url:video.value,watch_url:video.value,description:desc.value};let res=editId.value?await supa.from('movies').update(payload).eq('id',editId.value):await supa.from('movies').insert([payload]);if(res.error) throw res.error;btn.innerText='⏳ بينشر...';await updateGitHubJson();msg.innerText='✅ اتنشر';closeModal();load()}catch(e){msg.innerText='❌ '+e.message}finally{isSaving=false;btn.disabled=false;btn.innerText='حفظ ونشر 🚀'}}
async function load(){let {data}=await supa.from('movies').select('*').order('id',{ascending:false});allData=data||[];list.innerHTML=allData.map(m=>`<div class=card><div class=card-actions><button class=icon-btn onclick=startEdit(${m.id})>✏️</button><button class=icon-btn onclick=del(${m.id}) style=background:#e50914>🗑️</button></div><img src=${m.poster_url}><div class=card-body><b>${m.title}</b></div></div>`).join('')}
function filterMovies(){let q=search.value.toLowerCase();let f=allData.filter(m=>m.title.toLowerCase().includes(q));list.innerHTML=f.map(m=>`<div class=card><div class=card-actions><button class=icon-btn onclick=startEdit(${m.id})>✏️</button><button class=icon-btn onclick=del(${m.id}) style=background:#e50914>🗑️</button></div><img src=${m.poster_url}><div class=card-body><b>${m.title}</b></div></div>`).join('')}
function startEdit(id){let m=allData.find(x=>x.id==id);editId.value=m.id;title.value=m.title;year.value=m.year;category.value=m.category;video.value=m.video_url;desc.value=m.description;window.oldPoster=m.poster_url;preview.src=m.poster_url;preview.style.display='block';openModal()}
async function del(id){if(!confirm('تمسح؟')) return;await supa.from('movies').delete().eq('id',id);load();updateGitHubJson()}
load();
</script>
</body>
</html>
