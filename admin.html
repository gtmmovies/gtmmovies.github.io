<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTM ADMIN V5 - اقسام متعددة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{font-family:'Cairo',sans-serif;box-sizing:border-box}body{margin:0;background:#060606;color:#fff}
.topbar{height:64px;background:#0e0e0e;border-bottom:1px solid #1f1f1f;display:flex;align-items:center;justify-content:space-between;padding:0 15px;position:sticky;top:0;z-index:100}
.logo{font-weight:800}.logo span{color:#e50914}
.btn-add{background:#e50914;color:#fff;border:none;padding:10px 18px;border-radius:10px;font-weight:700;cursor:pointer}
.container{max-width:1200px;margin:15px auto;padding:0 15px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0;white-space:nowrap;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 16px;border-radius:20px;background:#1a1a1a;border:1px solid #222;color:#aaa;cursor:pointer;font-size:13px;font-weight:600;transition:.2s}
.tab.active{background:#e50914;color:#fff;border-color:#e50914}
.search{width:100%;background:#161616;border:1px solid #222;border-radius:12px;padding:12px;color:#fff;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{position:relative;background:#121212;border:1px solid #1f1f1f;border-radius:14px;overflow:hidden;transition:.2s}
.card:hover{border-color:#e50914;transform:translateY(-3px)}
.card img{width:100%;height:230px;object-fit:cover}
.card-body{padding:8px}.card-body b{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-body small{color:#777;font-size:10px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-actions{position:absolute;top:6px;left:6px;display:flex;gap:5px;z-index:10;background:rgba(0,0,0,.6);padding:4px;border-radius:8px}
.icon-btn{width:30px;height:30px;border-radius:8px;border:none;cursor:pointer;background:rgba(0,0,0,.8);color:#fff;font-size:12px}
.icon-btn.del{background:rgba(229,9,20,.9)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:200;padding:15px}
.modal.active{display:flex}
.modal-box{background:#111;border:1px solid #222;border-radius:20px;width:100%;max-width:500px;max-height:90vh;overflow:auto;padding:20px}
.modal-box input,.modal-box textarea{width:100%;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:12px;margin:6px 0;color:#fff}
.btn-save{width:100%;background:#e50914;border:none;padding:14px;border-radius:12px;color:#fff;font-weight:800;margin-top:10px;cursor:pointer}
.btn-save:disabled{background:#444}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cat-label{display:flex;gap:6px;align-items:center;background:#222;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12px;transition:.2s}
.cat-label:has(input:checked){background:#e50914;color:#fff;border:1px solid #ff2535}
</style>
</head>
<body>
<div class="topbar">
<div class="logo">GTM <span>V5 متعدد</span></div>
<button class="btn-add" onclick="openModal()">+ إضافة فيلم</button>
</div>
<div class="container">
<div class="tabs" id="tabs">
<button class="tab active" onclick="filterBy('الكل', this)">الكل <span id="c-all"></span></button>
<button class="tab" onclick="filterBy('افلام عربي', this)">عربي <span id="c-ar"></span></button>
<button class="tab" onclick="filterBy('افلام اجنبي', this)">أجنبي <span id="c-en"></span></button>
<button class="tab" onclick="filterBy('مسلسلات', this)">مسلسلات <span id="c-ser"></span></button>
<button class="tab" onclick="filterBy('اكشن', this)">أكشن</button>
<button class="tab" onclick="filterBy('كوميدي', this)">كوميدي</button>
<button class="tab" onclick="filterBy('رعب', this)">رعب</button>
<button class="tab" onclick="filterBy('دراما', this)">دراما</button>
</div>
<input class="search" id="search" placeholder="🔍 ابحث..." oninput="applyFilter()">
<div style="display:flex;gap:8px;margin:10px 0"><input id="ghToken" type="password" placeholder="توكن GitHub" style="flex:1;background:#111;border:1px solid #222;border-radius:10px;padding:10px;color:#fff"><button onclick="localStorage.setItem('gh_token',ghToken.value);alert('تم')" style="background:#222;color:#fff;border:none;border-radius:8px;padding:8px 12px;cursor:pointer">حفظ</button></div>
<div class="grid" id="list"></div>
</div>

<div class="modal" id="modal">
<div class="modal-box">
<div style="display:flex;justify-content:space-between"><h3 id="mtitle">إضافة فيلم</h3><button onclick="closeModal()" style="background:#222;border:none;color:#fff;width:32px;height:32px;border-radius:8px;cursor:pointer">✕</button></div>
<input id="title" placeholder="اسم الفيلم">
<input id="year" placeholder="السنة">
<div style="background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:10px;margin:6px 0">
<div style="font-size:11px;color:#888;margin-bottom:8px">اختار التصنيفات (ممكن اكتر من واحد):</div>
<div class="cat-grid">
<label class="cat-label"><input type="checkbox" class="catChk" value="افلام عربي"> افلام عربي</label>
<label class="cat-label"><input type="checkbox" class="catChk" value="افلام اجنبي"> افلام اجنبي</label>
<label class="cat-label"><input type="checkbox" class="catChk" value="مسلسلات"> مسلسلات</label>
<label class="cat-label"><input type="checkbox" class="catChk" value="اكشن"> اكشن</label>
<label class="cat-label"><input type="checkbox" class="catChk" value="كوميدي"> كوميدي</label>
<label class="cat-label"><input type="checkbox" class="catChk" value="رعب"> رعب</label>
<label class="cat-label"><input type="checkbox" class="catChk" value="دراما"> دراما</label>
<label class="cat-label"><input type="checkbox" class="catChk" value="انمي"> انمي</label>
</div>
</div>
<input type="file" id="file" accept="image/*"><img id="preview" style="width:100%;display:none;margin-top:10px;border-radius:10px;max-height:200px;object-fit:cover">
<input id="video" placeholder="رابط المشاهدة">
<textarea id="desc" placeholder="القصة..." rows="3"></textarea>
<input type="hidden" id="editId">
<button class="btn-save" id="saveBtn" onclick="save()">حفظ ونشر 🚀</button>
<div id="msg" style="font-size:12px;margin-top:8px"></div>
</div>
</div>

<script>
const supa=supabase.createClient('https://akkroydgqotbavvchiju.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFra3JveWRncW90YmF2dmNoaWp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MjY2MDcsImV4cCI6MjEwMjAwMjYwN30.lP10UuBAudqfOeoSpOkfHOXMR1Z24kY68CRNmKUcXpo');
let allData=[], selectedFile=null, currentCat='الكل';
const REPO_OWNER='gtmmovies', REPO_NAME='gtmmovies.github.io', FILE_PATH='movies.json';
ghToken.value=localStorage.getItem('gh_token')||'';
function openModal(){modal.classList.add('active')}function closeModal(){modal.classList.remove('active')}
file.addEventListener('change',()=>{selectedFile=file.files[0];let r=new FileReader();r.onload=e=>{preview.src=e.target.result;preview.style.display='block'};r.readAsDataURL(selectedFile)});
async function uploadPoster(){if(!selectedFile) return window.oldPoster;let fileName=Date.now()+'.jpg';let {error}=await supa.storage.from('posters').upload(fileName,selectedFile);if(error) throw error;let {data}=supa.storage.from('posters').getPublicUrl(fileName);return data.publicUrl;}
async function updateGitHubJson(){let token=localStorage.getItem('gh_token');if(!token) throw new Error('حط التوكن');let {data}=await supa.from('movies').select('*').order('id',{ascending:false});let b64=btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));let getRes=await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`,{headers:{Authorization:`Bearer ${token}`}});let sha=null;if(getRes.ok){let j=await getRes.json();sha=j.sha}let putRes=await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`,{method:'PUT',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({message:'update',content:b64,sha})});if(!putRes.ok) throw new Error('فشل GitHub')}
let isSaving=false;
async function save(){if(isSaving) return;if(!title.value) return alert('الاسم');let cats=[...document.querySelectorAll('.catChk:checked')].map(c=>c.value).join(', ');if(!cats) return alert('اختار تصنيف واحد على الاقل');isSaving=true;saveBtn.disabled=true;saveBtn.innerText='⏳ بيرفع...';try{let posterUrl=await uploadPoster();let payload={title:title.value,year:year.value,category:cats,poster_url:posterUrl,video_url:video.value,watch_url:video.value,description:desc.value};let res=editId.value?await supa.from('movies').update(payload).eq('id',editId.value):await supa.from('movies').insert([payload]);if(res.error) throw res.error;saveBtn.innerText='⏳ بينشر...';await updateGitHubJson();msg.innerText='✅ اتنشر';closeModal();resetForm();load()}catch(e){msg.innerText='❌ '+e.message;alert(e.message)}finally{isSaving=false;saveBtn.disabled=false;saveBtn.innerText='حفظ ونشر 🚀'}}
function resetForm(){editId.value='';title.value='';year.value='';video.value='';desc.value='';file.value='';preview.style.display='none';selectedFile=null;window.oldPoster=null;document.querySelectorAll('.catChk').forEach(c=>c.checked=false)}
async function load(){let {data}=await supa.from('movies').select('*').order('id',{ascending:false});allData=data||[];document.getElementById('c-all').innerText=`(${allData.length})`;document.getElementById('c-ar').innerText=`(${allData.filter(m=>m.category.includes('عربي')).length})`;document.getElementById('c-en').innerText=`(${allData.filter(m=>m.category.includes('اجنبي')).length})`;document.getElementById('c-ser').innerText=`(${allData.filter(m=>m.category.includes('مسلسلات')).length})`;applyFilter()}
function applyFilter(){let data=allData;if(currentCat!='الكل') data=data.filter(m=>m.category.includes(currentCat));let q=search.value.toLowerCase();if(q) data=data.filter(m=>m.title.toLowerCase().includes(q));render(data)}
function render(data){list.innerHTML=data.map(m=>`<div class=card><div class=card-actions><button class=icon-btn onclick=startEdit(${m.id})>✏️</button><button class=icon-btn del onclick=del(${m.id})>🗑️</button></div><img src=${m.poster_url} loading=lazy><div class=card-body><b>${m.title}</b><small>${m.category} • ${m.year||''}</small></div></div>`).join('')||'<div style=grid-column:1/-1;text-align:center;color:#666;padding:40px>مفيش افلام في القسم ده</div>'}
function filterBy(cat, el){currentCat=cat;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');applyFilter()}
function startEdit(id){let m=allData.find(x=>x.id==id);editId.value=m.id;title.value=m.title;year.value=m.year;video.value=m.video_url;desc.value=m.description;window.oldPoster=m.poster_url;preview.src=m.poster_url;preview.style.display='block';document.querySelectorAll('.catChk').forEach(chk=>chk.checked=m.category.includes(chk.value));document.getElementById('mtitle').innerText='تعديل: '+m.title;openModal()}
async function del(id){if(!confirm('تمسح؟')) return;await supa.from('movies').delete().eq('id',id);load();updateGitHubJson()}
load();
</script>
</body>
</html>
