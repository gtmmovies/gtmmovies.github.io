<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTM MOVIES</title>
<link rel="preconnect" href="https://akkroydgqotbavvchiju.supabase.co">
<link rel="preconnect" href="https://wsrv.nl">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#050507;color:#fff}
header{position:fixed;top:0;width:100%;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:14px 4%;background:rgba(0,0,0,.8);backdrop-filter:blur(10px)}
.logo{font-size:28px;font-weight:900;background:linear-gradient(90deg,#e50914,#ff3d5a);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.search input{background:#1a1a1a;border:none;color:#fff;padding:10px 18px;border-radius:30px;width:240px;outline:none}
.hero{height:85vh;position:relative;display:flex;align-items:center;padding:0 5%;background:#0a0a0a}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center top}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#050507 20%,transparent 80%),linear-gradient(0deg,#050507 10%,transparent 60%);z-index:1}
.hero-content{position:relative;z-index:2;max-width:600px}
.card{min-width:170px;width:170px;height:255px;border-radius:14px;overflow:hidden;background:#111;cursor:pointer;flex-shrink:0;position:relative}
.card img{width:100%;height:100%;object-fit:cover}
.card .ov{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.9),transparent 60%);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;opacity:0;transition:.2s}
.card:hover .ov{opacity:1}
.chips{padding:10px 4%;display:flex;gap:8px;overflow-x:auto;position:sticky;top:58px;z-index:5;background:#050507}
.chip{padding:7px 16px;border-radius:20px;background:#1a1a1a;cursor:pointer;white-space:nowrap;font-size:14px}
.chip.active{background:#e50914}
.row{padding:10px 0}.row h2{padding:0 4%;font-size:20px;margin-bottom:10px}
.slider{display:flex;gap:12px;overflow-x:auto;padding:10px 4% 20px;scrollbar-width:none}
.slider::-webkit-scrollbar{display:none}
</style>
</head><body>
<header><div class="logo">GTM MOVIES</div><div class="search"><input id="search" placeholder="ابحث..." oninput="doSearch()"></div></header>
<div class="hero" id="hero"><div class="hero-bg" id="heroBg"></div><div class="hero-content" id="heroContent"></div></div>
<div class="chips" id="chips"></div>
<div id="rows"></div>
<script>
const supa=supabase.createClient('https://akkroydgqotbavvchiju.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFra3JveWRncW90YmF2dmNoaWp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MjY2MDcsImV4cCI6MjEwMjAwMjYwN30.lP10UuBAudqfOeoSpOkfHOXMR1Z24kY68CRNmKUcXpo');
let allMovies=[];
function opt(u,w=300){if(!u)return '';return `https://wsrv.nl/?url=${encodeURIComponent(u)}&w=${w}&output=webp&q=70`}
async function load(){
 let {data}=await supa.from('movies').select('*').order('id',{ascending:false}).limit(80);
 allMovies=data||[];
 let cats=['الكل',...new Set(allMovies.map(m=>m.category||'افلام'))];
 document.getElementById('chips').innerHTML=cats.map(c=>`<div class="chip ${c=='الكل'?'active':''}" onclick="filterCat('${c}')">${c}</div>`).join('');
 if(allMovies[0]){
  document.getElementById('heroBg').style.backgroundImage=`url('${opt(allMovies[0].poster_url,800)}')`;
  document.getElementById('heroContent').innerHTML=`<h1 style="font-size:48px;font-weight:900;margin-bottom:10px">${allMovies[0].title}</h1><p style="color:#aaa;margin-bottom:20px">${(allMovies[0].description||'').slice(0,120)}</p><a style="padding:12px 28px;border-radius:30px;background:#fff;color:#000;font-weight:800;text-decoration:none" href="movie.html?id=${allMovies[0].id}">▶ شاهد</a>`;
 }
 render(allMovies);
}
function card(m){return `<div class="card" onclick="location.href='movie.html?id=${m.id}'"><img src="${opt(m.poster_url,300)}" loading="lazy"><div class="ov"><b style="font-size:13px">${m.title}</b></div></div>`}
function render(list){
 let cats=[...new Set(list.map(m=>m.category||'افلام'))];
 let h=`<div class="row"><h2>احدث الاضافات</h2><div class="slider">${list.slice(0,10).map(card).join('')}</div></div>`;
 cats.forEach(cat=>{let arr=list.filter(m=>(m.category||'افلام')==cat);h+=`<div class="row"><h2>${cat}</h2><div class="slider">${arr.map(card).join('')}</div></div>`});
 document.getElementById('rows').innerHTML=h;
}
function filterCat(c){document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.textContent==c));if(c=='الكل')render(allMovies);else render(allMovies.filter(m=>(m.category||'افلام')==c));}
function doSearch(){let q=document.getElementById('search').value.toLowerCase();if(!q){render(allMovies);return}let f=allMovies.filter(m=>m.title.toLowerCase().includes(q));document.getElementById('rows').innerHTML=`<div class="row"><h2>نتائج ${f.length}</h2><div class="slider" style="flex-wrap:wrap">${f.map(card).join('')}</div></div>`;}
load();
</script>
</body></html>
