<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTM MOVIES ADMIN</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&family=JetBrains+Mono:wght@700&family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000;--panel:#0A0A0A;--panel-2:#111111;--panel-3:#161616;--line:#1A1A1A;--line-2:#242424;--white:#FFFFFF;--muted:#7A7A7A;--muted-2:#525252;--red:#FF2A2A;
  --radius-xl:32px;--radius-lg:24px;--radius-md:16px;--radius-sm:12px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--white)}
body{font-family:'Inter','Cairo',system-ui; -webkit-font-smoothing:antialiased; letter-spacing:-0.02em}
button,input,textarea,select{font:inherit}
.topbar{position:sticky;top:0;z-index:100;height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(0,0,0,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:baseline;gap:10px;font-weight:900;font-size:22px;letter-spacing:-0.06em;text-transform:uppercase}
.logo .gtm{color:var(--white)} .logo .admin{font-family:'JetBrains Mono',monospace;color:var(--muted);font-size:11px;letter-spacing:0.18em;border:1px solid var(--line-2);padding:4px 10px;border-radius:100px}
.btn-add{background:var(--white);color:#000;border:1px solid var(--white);height:44px;padding:0 22px;border-radius:100px;font-weight:900;font-size:13px;cursor:pointer;transition:all .15s}
.btn-add:hover{transform:translateY(-1px);background:#F2F2F2}
.container{max-width:1320px;margin:0 auto;padding:28px 28px 80px}
.meta-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:28px}
.token-box{display:flex;gap:0;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:100px;padding:6px 6px 6px 16px;flex:1;max-width:520px;min-width:280px}
.token-box input{flex:1;background:transparent;border:0;outline:0;color:var(--white);font-size:13px;font-family:'JetBrains Mono',monospace;padding:8px 0}
.token-box input::placeholder{color:var(--muted-2)}
.token-box button{background:var(--white);color:#000;border:0;border-radius:100px;padding:10px 18px;font-weight:900;font-size:12px;cursor:pointer}
#status{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.08em;color:var(--muted);text-transform:uppercase}
#status::before{content:'● ';color:#2a2a2a}
.counts{display:flex;gap:10px;align-items:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}
.counts strong{color:var(--white);font-size:13px}
.tabs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:8px 0 18px;white-space:nowrap}
.tabs::-webkit-scrollbar{display:none}
.tab{height:40px;padding:0 18px;border-radius:100px;background:var(--panel);border:1px solid var(--line);color:var(--muted);cursor:pointer;font-weight:800;font-size:12px;transition:all .16s;flex-shrink:0}
.tab:hover{border-color:var(--line-2);color:var(--white)}
.tab.active{background:var(--white);color:#000;border-color:var(--white);box-shadow:0 0 0 4px rgba(255,255,255,0.06)}
.tab span{font-family:'JetBrains Mono',monospace;margin-right:6px;font-size:11px;opacity:.7}
.search{width:100%;height:56px;background:var(--white) !important;color:#000 !important;border:2px solid var(--white);border-radius:var(--radius-md);padding:0 20px;font-size:14px;font-weight:700;outline:0;transition:all .15s}
.search::placeholder{color:#9A9A9A}
.search:focus{box-shadow:0 0 0 6px rgba(255,255,255,0.12)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:18px;margin-top:20px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-xl);overflow:hidden;transition:all .25s;display:flex;flex-direction:column}
.card:hover{border-color:#2A2A2A;transform:translateY(-4px);background:var(--panel-2);box-shadow:0 20px 40px rgba(0,0,0,.5)}
.card img{width:100%;height:264px;object-fit:cover;display:block;background:#050505}
.card-body{padding:14px 14px 12px;flex:1}
.card-body b{display:block;font-size:13px;font-weight:900;line-height:1.3;letter-spacing:-0.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-body small{display:flex;gap:8px;margin-top:6px;color:var(--muted);font-size:11px;font-family:'JetBrains Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.season-badge{position:absolute;top:12px;right:12px;background:var(--white);color:#000;padding:4px 10px;border-radius:100px;font-size:10px;font-weight:900;font-family:'JetBrains Mono',monospace;z-index:2}
.card-actions{display:flex;gap:8px;padding:10px 12px 12px;background:rgba(0,0,0,.4);border-top:1px solid var(--line);margin-top:auto}
.btn-edit,.btn-del{flex:1;height:38px;border-radius:100px;border:1px solid var(--line);font-weight:900;font-size:12px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:6px;font-family:'Cairo',sans-serif}
.btn-edit{background:var(--white);color:#000;border-color:var(--white)}
.btn-edit:hover{background:#eee;transform:translateY(-1px)}
.btn-del{background:transparent;color:var(--muted);border-color:var(--line)}
.btn-del:hover{background:var(--red);color:#fff;border-color:var(--red)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.9);backdrop-filter:blur(16px);display:none;align-items:center;justify-content:center;z-index:200;padding:18px}
.modal.active{display:flex}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-xl);width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:28px 28px 24px;box-shadow:0 40px 120px rgba(0,0,0,0.9)}
.modal-box::-webkit-scrollbar{width:6px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.modal-head h3{font-weight:900;font-size:18px}
.close{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff;cursor:pointer;display:grid;place-items:center}
.modal-box input,.modal-box textarea{width:100%;background:#fff !important;color:#000 !important;border:2px solid #fff;border-radius:14px;padding:13px 14px;margin:7px 0;font-size:13px;font-weight:700;outline:none;transition:.15s}
.modal-box textarea{resize:vertical;background:#fff !important;color:#000 !important}
.modal-box input::placeholder,.modal-box textarea::placeholder{color:#999}
.modal-box input:focus,.modal-box textarea:focus{box-shadow:0 0 0 4px rgba(255,255,255,0.12)}
.btn-save{width:100%;background:var(--white);color:#000;border:1px solid var(--white);padding:15px;border-radius:14px;font-weight:900;margin-top:16px;cursor:pointer;font-size:14px;transition:.15s}
.btn-save:hover{transform:translateY(-1px);background:#F2F2F2}
.btn-save:disabled{background:#333;color:#666;border-color:#333;box-shadow:none}
.step{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-weight:900;margin:22px 0 10px 0;padding-top:18px;border-top:1px solid var(--line);letter-spacing:0.08em;text-transform:uppercase;font-family:'JetBrains Mono',monospace}
.step i{width:22px;height:22px;background:var(--white);color:#000;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:900}
.typeSel{display:flex;gap:10px;margin:8px 0}
.typeBtn{flex:1;padding:14px;border-radius:100px;border:1px solid var(--line);background:var(--panel);color:#666;cursor:pointer;text-align:center;font-weight:900;font-size:13px;transition:.2s}
.typeBtn.active{background:var(--white);color:#000;border-color:var(--white);box-shadow:0 0 0 4px rgba(255,255,255,0.08)}
.cat-grid,.sec-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat-label,.sec-label{display:flex;gap:8px;align-items:center;background:var(--panel-2);padding:12px 14px;border-radius:12px;cursor:pointer;font-size:12px;font-weight:800;border:1px solid var(--line);transition:.15s;color:var(--muted)}
.cat-label:has(input:checked){background:#fff;color:#000;border-color:#fff}
.sec-label:has(input:checked){background:#fff;color:#000;border-color:#fff}
.cat-label input,.sec-label input{accent-color:#000}
.upload-area{border:2px dashed var(--line-2);border-radius:16px;padding:20px;text-align:center;background:var(--panel-2);margin:10px 0;transition:.2s;cursor:pointer}
.upload-area:hover{border-color:#555;background:#151515}
.upload-area.dragover{border-color:var(--white);background:#151515}
.upload-area input{display:none}
.upload-btns{display:flex;gap:8px;margin:10px 0}
.small-btn{flex:1;padding:11px;border-radius:100px;border:1px solid var(--line);background:var(--panel-2);color:#666;cursor:pointer;font-weight:900;font-size:11px;transition:.2s;font-family:'JetBrains Mono',monospace}
.small-btn.active{background:var(--white);color:#000;border-color:var(--white)}
#previewWrap img{border-radius:20px;border:1px solid var(--line)}
.epBox{background:#080808;border:1px dashed var(--line);border-radius:20px;padding:12px;margin-top:10px;max-height:420px;overflow-y:auto}
.epItem{background:var(--panel-2);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;position:relative}
.epItem:hover{border-color:#2A2A2A}
.delEp{position:absolute;top:10px;left:10px;background:var(--red);color:#fff;border:0;border-radius:100px;padding:5px 12px;cursor:pointer;font-size:11px;font-weight:900;font-family:'JetBrains Mono',monospace}
.seasonBox{background:var(--panel-2);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
</style>
</head>
<body>
<div class="topbar">
<div class="logo"><span class="gtm">GTM</span> <span class="admin">SIDI GABER</span></div>
<button class="btn-add" onclick="openModal()">+ NEW TITLE</button>
</div>
<div class="container">
<div class="meta-row">
<div class="token-box">
<input id="ghToken" type="password" placeholder="Password">
<button onclick="saveToken()">SAVE TOKEN</button>
</div>
<div class="counts">
<span><strong id="c-all">0</strong> TOTAL</span>
<span>•</span>
<span><strong id="c-series">0</strong> SERIES</span>
<span>•</span>
<span id="status">LOADING...</span>
</div>
</div>

<div class="tabs">
<button class="tab active" onclick="filterBy('الكل', this)">الكل</button>
<button class="tab" onclick="filterBy('افلام عربية', this)">افلام عربية</button>
<button class="tab" onclick="filterBy('افلام اجنبية', this)">افلام اجنبية</button>
<button class="tab" onclick="filterBy('مسلسلات عربية', this)">مسلسلات عربية</button>
<button class="tab" onclick="filterBy('مسلسلات اجنبية', this)">مسلسلات اجنبية</button>
</div>
<input class="search" id="search" placeholder="SEARCH TITLES..." oninput="applyFilter()">
<div class="grid" id="list"></div>
</div>

<div class="modal" id="modal">
<div class="modal-box">
<div class="modal-head"><h3 id="mtitle">NEW TITLE</h3><button class="close" onclick="closeModal()">✕</button></div>

<div class="step"><i>1</i> Type</div>
<div class="typeSel">
<div class="typeBtn active" id="typeMovieBtn" onclick="setType('movie')">🎬 MOVIE</div>
<div class="typeBtn" id="typeSeriesBtn" onclick="setType('series')">📺 SERIES</div>
</div>

<div class="step"><i>2</i> Title</div>
<input id="title" placeholder="مثال: Film title">

<div class="step"><i>3</i> Story</div>
<textarea id="desc" placeholder="القصة..." rows="4"></textarea>

<div class="step"><i>4</i> Year</div>
<input id="year" placeholder="2026" type="number">

<div class="step"><i>5</i> Genre</div>
<div class="cat-grid">
<label class="cat-label"><input type="checkbox" class="catChk" value="اكشن"> اكشن</label>
<label class="cat-label"><input type="checkbox" class="catChk" value="كوميدي"> كوميدي</label>
<label class="cat-label"><input type="checkbox" class="catChk" value="رعب"> رعب</label>
<label class="cat-label"><input type="checkbox" class="catChk" value="دراما"> دراما</label>
<label class="cat-label"><input type="checkbox" class="catChk" value="تشويق و اثارة">تشويق و اثارة</label>
<label class="cat-label"><input type="checkbox" class="catChk" value="مغامرة"> مغامرة</label>
<label class="cat-label"><input type="checkbox" class="catChk" value="رومانسي"> رومانسي</label>
<label class="cat-label"><input type="checkbox" class="catChk" value="انمي"> انمي</label>
</div>

<div class="step"><i>6</i> Section</div>
<div class="sec-grid">
<label class="sec-label"><input type="checkbox" class="secChk" value="افلام عربية"> افلام عربية</label>
<label class="sec-label"><input type="checkbox" class="secChk" value="افلام اجنبية"> افلام اجنبية</label>
<label class="sec-label"><input type="checkbox" class="secChk" value="مسلسلات عربية"> مسلسلات عربية</label>
<label class="sec-label"><input type="checkbox" class="secChk" value="مسلسلات اجنبية"> مسلسلات اجنبية</label>
</div>

<div class="step"><i>7</i> Poster</div>
<div class="upload-btns">
<button class="small-btn active" id="btnModeFile" onclick="setPosterMode('file')">FROM DEVICE</button>
<button class="small-btn" id="btnModeLink" onclick="setPosterMode('link')">LINK URL</button>
</div>
<div id="posterFileMode">
<div class="upload-area" id="uploadArea" onclick="document.getElementById('posterFile').click()">
<div style="font-size:28px">↑</div>
<div style="font-size:11px;color:#999;margin-top:6px;font-weight:900;font-family:'JetBrains Mono',monospace">DROP IMAGE OR CLICK</div>
<div style="font-size:10px;color:#555;margin-top:2px;font-family:'JetBrains Mono',monospace">JPG, PNG, WEBP &lt; 5MB</div>
<input type="file" id="posterFile" accept="image/*">
</div>
<div id="fileStatus" style="font-size:11px;color:#888;margin:4px 0;font-family:'JetBrains Mono',monospace"></div>
</div>
<div id="posterLinkMode" style="display:none">
<input id="posterUrl" placeholder="https://...">
</div>
<div id="previewWrap" style="display:none"><img id="preview" style="width:100%;max-height:300px;object-fit:cover;margin-top:10px"><div id="previewInfo" style="font-size:11px;color:#2ecc71;margin-top:6px;font-family:'JetBrains Mono',monospace;font-weight:700"></div></div>

<div id="movieFields">
<div class="step"><i>8</i> Servers - Movie</div>
<input id="video" placeholder="🎬 WATCH SERVER">
<input id="dl" placeholder="⬇ DOWNLOAD (optional)">
</div>

<div id="seriesFields" style="display:none">
<div class="step"><i>8</i> Season Info</div>
<div class="seasonBox">
<input id="seasonNum" type="number" placeholder="رقم الموسم - 1">
<input id="seasonTitle" placeholder="عنوان الموسم - الموسم الاول">
</div>

<div class="step"><i>9</i> Episodes - 2 Servers + Download per Ep</div>
<div class="epBox" id="epContainer"></div>
<button onclick="addEpisode()" style="width:100%;background:#fff;color:#000;border:0;padding:12px;border-radius:100px;margin-top:10px;cursor:pointer;font-weight:900;font-family:'JetBrains Mono',monospace">+ ADD EPISODE</button>
<input id="seriesDl" placeholder="⬇ Full Season Download (optional)" style="margin-top:12px">
</div>

<input type="hidden" id="editId">
<input type="hidden" id="finalPosterUrl">
<button class="btn-save" id="saveBtn" onclick="save()">SAVE & PUBLISH — DIRECT →</button>
<div id="msg" style="font-size:11px;margin-top:12px;text-align:center;font-family:'JetBrains Mono',monospace"></div>
</div>
</div>

<script>
const REPO_OWNER='gtmmovies', REPO_NAME='gtmmovies.github.io', FILE_PATH='movies.json';
let allData=[], currentCat='الكل', fileSha=null, episodes=[], currentType='movie';
const $=id=>document.getElementById(id);
$('ghToken').value=localStorage.getItem('gh_token')||'';
function saveToken(){ localStorage.setItem('gh_token',$('ghToken').value.trim()); alert('تم حفظ التوكن'); load(); }
function openModal(){ $('modal').classList.add('active') } function closeModal(){ $('modal').classList.remove('active') }
function setType(t){
 currentType=t;
 $('typeMovieBtn').classList.toggle('active',t=='movie');
 $('typeSeriesBtn').classList.toggle('active',t=='series');
 $('movieFields').style.display=t=='movie'?'block':'none';
 $('seriesFields').style.display=t=='series'?'block':'none';
}
function setPosterMode(m){
 $('btnModeFile').classList.toggle('active',m=='file');
 $('btnModeLink').classList.toggle('active',m=='link');
 $('posterFileMode').style.display=m=='file'?'block':'none';
 $('posterLinkMode').style.display=m=='link'?'block':'none';
}
function handleFile(file){
 if(!file) return;
 if(file.size > 5*1024*1024) return alert('الصورة كبيرة - اقل من 5 ميجا');
 $('fileStatus').innerText='READING...';
 let reader=new FileReader();
 reader.onload=e=>{
   $('preview').src=e.target.result;
   $('previewWrap').style.display='block';
   $('previewInfo').innerText='FILE: '+file.name;
   $('finalPosterUrl').dataset.base64=e.target.result;
   $('finalPosterUrl').dataset.filename=file.name;
   $('finalPosterUrl').value='';
   $('fileStatus').innerText='READY TO UPLOAD';
   $('posterUrl').value='';
 }
 reader.readAsDataURL(file);
}
$('posterFile').addEventListener('change', e=>{ handleFile(e.target.files[0]) });
let uploadArea=$('uploadArea');
uploadArea.addEventListener('dragover', e=>{ e.preventDefault(); uploadArea.classList.add('dragover'); });
uploadArea.addEventListener('dragleave', ()=> uploadArea.classList.remove('dragover'));
uploadArea.addEventListener('drop', e=>{ e.preventDefault(); uploadArea.classList.remove('dragover'); handleFile(e.dataTransfer.files[0]); });
$('posterUrl').addEventListener('input',()=>{
  let val=$('posterUrl').value.trim();
  if(val){
    $('preview').src=val;
    $('previewWrap').style.display='block';
    $('previewInfo').innerText='LINK';
    $('finalPosterUrl').value=val;
    $('finalPosterUrl').dataset.base64='';
  }else{ $('previewWrap').style.display='none'; $('finalPosterUrl').value=''; }
});
function b64Encode(s){return btoa(unescape(encodeURIComponent(s)))} function b64Decode(b){return decodeURIComponent(escape(atob(b)))}
async function ghFetch(path, opts={}){
  let token=(localStorage.getItem('gh_token')||'').trim();
  if(!token) throw new Error('حط التوكن الاول');
  let headers={ Authorization:'Bearer '+token, Accept:'application/vnd.github.v3+json' };
  let res=await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {...opts, headers});
  if(!res.ok){ let t=await res.text(); throw new Error('GitHub '+res.status+': '+t.slice(0,200)); }
  return res.json();
}
async function uploadImageToGitHub(base64Data, filename){
  let pureBase64 = base64Data.split(',')[1];
  let ext = filename.split('.').pop() || 'jpg';
  let newName = `images/poster_${Date.now()}_${Math.random().toString(36).substr(2,5)}.${ext}`;
  let body={ message:'upload poster '+newName, content:pureBase64 };
  await ghFetch(newName, { method:'PUT', body: JSON.stringify(body) });
  return `https://${REPO_OWNER}.github.io/${newName}`;
}
async function load(){
  try{
    $('status').innerText='LOADING...';
    let data;
    try{
      let jf=await ghFetch(FILE_PATH); fileSha=jf.sha; data=JSON.parse(b64Decode(jf.content.replace(/\n/g,'')));
    }catch(e){
      let r=await fetch(`https://${REPO_OWNER}.github.io/${FILE_PATH}?t=${Date.now()}`); data=await r.json();
      try{ let jf=await ghFetch(FILE_PATH); fileSha=jf.sha; }catch(_){}
    }
    allData=Array.isArray(data)?data:(data.movies||[]);
    $('status').innerText=`${allData.length} TITLES`; $('c-all').innerText=allData.length; $('c-series').innerText=allData.filter(m=>m.type=='series' || m.episodes).length; applyFilter();
  }catch(e){ $('status').innerText='ERROR: '+e.message; }
}
function applyFilter(){ let d=[...allData]; if(currentCat!='الكل') d=d.filter(m=>(m.category||'').includes(currentCat)); let q=$('search').value.toLowerCase().trim(); if(q) d=d.filter(m=>(m.title||'').toLowerCase().includes(q)); render(d); }
function render(data){ $('list').innerHTML=data.map(m=>`<div class=card>${m.season?`<div class=season-badge>S${m.season}</div>`:''}<img src="${m.poster_url||m.poster||''}" loading=lazy><div class=card-body><b>${m.title||''}${m.season?` - م${m.season}`:''}</b><small>${m.category||''} ${m.episodes?'• '+m.episodes.length+' EP':''} ${m.seasonTitle?`• ${m.seasonTitle}`:''}</small></div><div class=card-actions><button class=btn-edit onclick="startEdit('${m.id}')">✍ تعديل</button><button class=btn-del onclick="delMovie('${m.id}')">❎ حذف</button></div></div>`).join('')||'<div style=grid-column:1/-1;text-align:center;color:#555;padding:60px;background:#0A0A0A;border-radius:32px;border:1px dashed #1A1A1A;font-family:JetBrains Mono,monospace">EMPTY - ADD FIRST TITLE</div>'; }
function filterBy(cat, el){ currentCat=cat; document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); el.classList.add('active'); applyFilter(); }

function addEpisode(data=null){
 let ep=data||{num:episodes.length+1,title:`الحلقة ${episodes.length+1}`,video_url:'',video_url2:'',download_url:''};
 episodes.push(ep);
 renderEpisodes();
}
function renderEpisodes(){
 $('epContainer').innerHTML=episodes.map((ep,i)=>`
  <div class="epItem">
   <button class="delEp" onclick="removeEp(${i})">REMOVE</button>
   <div style="font-size:10px;color:#666;font-weight:900;margin-bottom:10px;letter-spacing:0.1em;font-family:'JetBrains Mono',monospace">EPISODE ${i+1}</div>
   <div style="display:grid;grid-template-columns:1fr 70px;gap:8px">
    <input value="${ep.title}" oninput="episodes[${i}].title=this.value" placeholder="عنوان الحلقة">
    <input type="number" value="${ep.num||i+1}" oninput="episodes[${i}].num=this.value" placeholder="#">
   </div>
   <input value="${ep.video_url||''}" oninput="episodes[${i}].video_url=this.value" placeholder="SERVER 1">
   <input value="${ep.video_url2||''}" oninput="episodes[${i}].video_url2=this.value" placeholder="SERVER 2">
   <input value="${ep.download_url||''}" oninput="episodes[${i}].download_url=this.value" placeholder="DOWNLOAD">
  </div>
 `).join('');
}
function removeEp(i){episodes.splice(i,1);renderEpisodes();}

function startEdit(id){
  let m=allData.find(x=>String(x.id)==String(id)); if(!m) return;
  $('editId').value=m.id; $('title').value=m.title||''; $('year').value=m.year||''; 
  $('posterUrl').value=m.poster_url||m.poster||''; 
  $('finalPosterUrl').value=m.poster_url||m.poster||'';
  if($('posterUrl').value){$('preview').src=$('posterUrl').value; $('previewWrap').style.display='block'; $('previewInfo').innerText='CURRENT'; setPosterMode('link');}
  $('desc').value=m.description||'';
  $('seasonNum').value=m.season||'';
  $('seasonTitle').value=m.seasonTitle||'';
  let allCats=(m.category||'').split(',').map(s=>s.trim());
  document.querySelectorAll('.catChk').forEach(chk=> chk.checked=allCats.includes(chk.value));
  document.querySelectorAll('.secChk').forEach(chk=> chk.checked=allCats.includes(chk.value));
  if(m.episodes && m.episodes.length>0){
    setType('series'); episodes=m.episodes.map(e=>({...e, download_url:e.download_url||''})); renderEpisodes(); $('seriesDl').value=m.download_url||'';
  }else{
    setType('movie'); episodes=[]; renderEpisodes(); $('video').value=m.watch_url||m.video_url||''; $('dl').value=m.download_url||'';
  }
  $('mtitle').innerText='EDIT: '+m.title; openModal();
}
async function save(){
  if($('saveBtn').disabled) return;
  if(!$('title').value.trim()) return alert('اسم الفيلم');
  let genreCats=[...document.querySelectorAll('.catChk:checked')].map(c=>c.value);
  let secCats=[...document.querySelectorAll('.secChk:checked')].map(c=>c.value);
  let allCats=[...genreCats, ...secCats].join(', ');
  if(!allCats) return alert('اختار تصنيف او قسم');
  if(secCats.length==0) return alert('اختار القسم');
  if(!(localStorage.getItem('gh_token')||'').trim()) return alert('حط التوكن');
  $('saveBtn').disabled=true; $('saveBtn').innerText='PUBLISHING...'; $('msg').innerText='';
  try{
    let posterUrl='';
    if($('finalPosterUrl').dataset.base64){
      $('msg').innerText='UPLOADING POSTER...';
      posterUrl = await uploadImageToGitHub($('finalPosterUrl').dataset.base64, $('finalPosterUrl').dataset.filename||'poster.jpg');
    }else{
      posterUrl = $('finalPosterUrl').value.trim() || $('posterUrl').value.trim();
    }
    if(!posterUrl) throw new Error('حط صورة');

    let payload={
      id: $('editId').value ? String($('editId').value) : String(Date.now()),
      title: $('title').value.trim(),
      year: $('year').value.trim(),
      category: allCats,
      poster_url: posterUrl, poster: posterUrl,
      description: $('desc').value.trim()
    };
    if(currentType=='movie'){
      if(!$('video').value.trim()) throw new Error('حط سيرفر المشاهدة');
      payload.video_url=$('video').value.trim();
      payload.watch_url=$('video').value.trim();
      payload.download_url=$('dl').value.trim();
      payload.type='movie';
    }else{
      if(episodes.length==0) throw new Error('ضيف حلقة');
      // مواسم
      let sNum = $('seasonNum').value.trim();
      let sTitle = $('seasonTitle').value.trim();
      if(sNum) payload.season = parseInt(sNum);
      if(sTitle) payload.seasonTitle = sTitle;
      else if(sNum) payload.seasonTitle = `الموسم ${sNum}`;
      
      payload.episodes=episodes.filter(e=>e.video_url).map((e,i)=>({
        num:parseInt(e.num)||i+1,
        title:e.title||`الحلقة ${i+1}`,
        video_url:e.video_url,
        video_url2:e.video_url2||'',
        download_url:e.download_url||'',
        season: payload.season||1
      }));
      payload.download_url=$('seriesDl').value.trim();
      payload.type='series';
      payload.video_url=payload.episodes[0]?.video_url||'';
      payload.watch_url=payload.episodes[0]?.video_url||'';
      payload.video_url2=payload.episodes[0]?.video_url2||'';
    }
    let newData=$('editId').value?allData.map(m=> String(m.id)==String($('editId').value) ? {...m, ...payload} : m):[payload, ...allData];
    try{ let jf=await ghFetch(FILE_PATH); fileSha=jf.sha; }catch(_){}
    let b64=b64Encode(JSON.stringify(newData,null,2));
    let body={ message:'update '+payload.title, content:b64 }; if(fileSha) body.sha=fileSha;
    await ghFetch(FILE_PATH, { method:'PUT', body: JSON.stringify(body) });
    $('msg').innerText='✅ LIVE'; closeModal(); resetForm(); setTimeout(load,2000);
  }catch(e){ $('msg').innerText='❌ '+e.message; alert(e.message); }
  finally{ $('saveBtn').disabled=false; $('saveBtn').innerText='SAVE & PUBLISH — DIRECT →'; }
}
function resetForm(){ $('editId').value=''; $('title').value=''; $('year').value=''; $('posterUrl').value=''; $('finalPosterUrl').value=''; $('finalPosterUrl').dataset.base64=''; $('video').value=''; $('dl').value=''; $('desc').value=''; $('seriesDl').value=''; $('seasonNum').value=''; $('seasonTitle').value=''; $('previewWrap').style.display='none'; $('fileStatus').innerText=''; document.querySelectorAll('.catChk').forEach(c=>c.checked=false); document.querySelectorAll('.secChk').forEach(c=>c.checked=false); episodes=[]; renderEpisodes(); setType('movie'); setPosterMode('file'); }
async function delMovie(id){ if(!confirm('تمسح؟')) return; try{ $('status').innerText='DELETING...'; let nd=allData.filter(m=> String(m.id)!=String(id)); try{ let jf=await ghFetch(FILE_PATH); fileSha=jf.sha; }catch(_){} let b64=b64Encode(JSON.stringify(nd,null,2)); await ghFetch(FILE_PATH, { method:'PUT', body: JSON.stringify({ message:'delete '+id, content:b64, sha:fileSha }) }); allData=nd; applyFilter(); $('status').innerText='DELETED'; }catch(e){ alert(e.message); } }
load();
renderEpisodes();
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
