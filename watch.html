<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTM Movies - مشاهدة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{font-family:'Cairo',sans-serif;box-sizing:border-box}
body{background:#080808;color:#fff;margin:0}
.nav{height:60px;background:#0e0e0e;border-bottom:1px solid #1f1f1f;display:flex;align-items:center;justify-content:space-between;padding:0 15px;position:sticky;top:0;z-index:100}
.nav b{color:#e50914;font-size:22px;cursor:pointer}
.nav a{color:#aaa;text-decoration:none;font-size:13px;background:#1a1a1a;padding:6px 12px;border-radius:20px;border:1px solid #222}
.container{max-width:1000px;margin:15px auto;padding:0 12px}
.player-wrap{position:relative;background:#000;border-radius:16px;overflow:hidden;border:1px solid #1f1f1f;aspect-ratio:16/9}
.player-wrap iframe,.player-wrap video{width:100%;height:100%;border:none;background:#000}
.servers{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;background:#111;padding:10px;border-radius:12px;border:1px solid #1f1f1f}
.server-btn{padding:8px 16px;border-radius:20px;border:1px solid #222;background:#1a1a1a;color:#aaa;cursor:pointer;font-size:13px;font-weight:600;transition:.2s}
.server-btn.active{background:#e50914;color:#fff;border-color:#e50914}
.server-btn:hover{border-color:#e50914;color:#fff}

/* خانة الحلقات الجديدة - نفس استايل السيرفرات */
.episodes-box{display:none;background:#111;padding:10px;border-radius:12px;border:1px solid #1f1f1f;margin:12px 0}
.episodes-box.show{display:block}
.episodes-head{font-size:13px;font-weight:800;color:#fff;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.episodes-list{display:flex;gap:8px;flex-wrap:wrap;max-height:220px;overflow-y:auto;padding:2px}
.ep-btn{min-width:52px;height:42px;border-radius:10px;border:1px solid #222;background:#1a1a1a;color:#bbb;cursor:pointer;font-size:13px;font-weight:800;transition:.2s;display:grid;place-items:center}
.ep-btn.active{background:#fff;color:#000;border-color:#fff;transform:scale(1.05)}
.ep-btn:hover{border-color:#555;color:#fff}
.ep-btn.watched{border-color:#25D366;color:#25D366}

.info{background:#111;border:1px solid #1f1f1f;padding:18px;border-radius:16px;margin-top:12px}
.info h1{margin:0 0 6px 0;font-size:20px}
.meta{color:#777;font-size:12px;margin-bottom:10px}
.info p{color:#bbb;line-height:1.7;font-size:14px}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{padding:10px 16px;border-radius:10px;text-decoration:none;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn-back{background:#1a1a1a;color:#fff;border:1px solid #222}
.btn-dl{background:#e50914;color:#fff}
.btn-wa{background:#25D366;color:#fff}
.notice{background:#1a1300;border:1px solid #332600;color:#ffcc00;padding:10px;border-radius:10px;font-size:12px;margin:10px 0;display:none}
</style>
</head>
<body>
<div class="nav">
  <b onclick="location.href='index.html'">GTM MOVIES</b>
  <a href="index.html">← الرئيسية</a>
</div>
<div class="container">
  <div class="player-wrap" id="playerWrap">
    <div id="loading" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#666">جاري تحميل المشغل...</div>
  </div>

  <!-- خانة الحلقات - تظهر للمسلسلات فقط -->
  <div class="episodes-box" id="episodesBox">
    <div class="episodes-head">📺 الحلقات - <span id="epCount" style="color:#888;font-weight:400"></span></div>
    <div class="episodes-list" id="episodesList"></div>
  </div>

  <div class="servers" id="servers">
    <button class="server-btn active" onclick="setServer(0)">▶ سيرفر المشاهدة 1</button>
    <button class="server-btn" onclick="setServer(1)">▶ سيرفر المشاهدة 2</button>
    <button class="server-btn" onclick="setServer(2)">▶ سيرفر احتياطي</button>
    <button class="server-btn" onclick="setServer(3)">⬇ سيرفر التحميل</button>
  </div>

  <div class="notice" id="notice"></div>

  <div class="info">
    <h1 id="title">جاري التحميل...</h1>
    <div class="meta" id="meta"></div>
    <p id="desc"></p>
    <div class="actions">
      <a class="btn btn-back" href="index.html">← رجوع</a>
      <a class="btn btn-dl" id="dlBtn" href="#" target="_blank">⬇ تحميل الفيلم</a>
      <a class="btn btn-wa" href="https://whatsapp.com/channel/0029Va6fU0X1yT28NTQGys1I" target="_blank">واتساب</a>
    </div>
  </div>
</div>

<script>
const id = new URLSearchParams(window.location.search).get('id');
let movie=null;
let servers=[];
let currentServer=0;
let currentEp=0;

function getCats(m){return (m.category||'').split(',').map(s=>s.trim()).filter(Boolean);}
function isSeries(m){
  let cats=getCats(m);
  return cats.some(c=>c.includes('مسلسل')) || (m.episodes && m.episodes.length>0) || m.type==='series';
}

function isDirectVideo(url){
  if(!url) return false;
  return url.match(/\.(mp4|m3u8|webm)(\?|$)/i);
}

function fixDrive(url){
  if(!url) return url;
  if(url.includes('drive.google.com')){
    let match=url.match(/\/d\/([^\/]+)/);
    if(match) return `https://drive.google.com/file/d/${match[1]}/preview`;
  }
  return url;
}

function makePlayer(url){
  const wrap=document.getElementById('playerWrap');
  wrap.innerHTML='';
  if(!url){
    wrap.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#666">لا يوجد رابط مشاهدة</div>';
    return;
  }
  if(isDirectVideo(url)){
    const v=document.createElement('video');
    v.controls=true; v.autoplay=true; v.playsInline=true; v.src=url;
    v.style.width='100%'; v.style.height='100%';
    wrap.appendChild(v);
  }else{
    const ifr=document.createElement('iframe');
    ifr.src=url; ifr.allowFullscreen=true;
    ifr.allow='autoplay; fullscreen; encrypted-media';
    ifr.referrerPolicy='no-referrer';
    wrap.appendChild(ifr);
  }
}

function buildServers(){
  // لو مسلسل، خد لينكات الحلقة الحالية
  let ep = movie.episodes ? movie.episodes[currentEp] : null;
  let mainUrl = ep ? (ep.video_url||movie.video_url) : (movie.watch_url||movie.video_url||'');
  let url2 = ep ? (ep.video_url2||movie.video_url2) : (movie.video_url2||'');
  let dlUrl = movie.download_url || mainUrl;

  servers=[
    fixDrive(mainUrl),
    url2 ? fixDrive(url2) : mainUrl,
    fixDrive(movie.video_url2 || url2 || mainUrl),
    dlUrl
  ];
}

function setServer(idx){
  currentServer=idx;
  document.querySelectorAll('.server-btn').forEach((b,i)=> b.classList.toggle('active', i===idx));
  const url=servers[idx];
  if(!url){
    document.getElementById('notice').style.display='block';
    document.getElementById('notice').innerText='⚠ السيرفر ده مش متاح للفيلم ده، جرب سيرفر تاني';
    makePlayer(servers.find(s=>s) || '');
  }else{
    document.getElementById('notice').style.display='none';
    makePlayer(url);
  }
  localStorage.setItem('last_server', idx);
}

function playEp(idx){
  currentEp=idx;
  document.querySelectorAll('.ep-btn').forEach((b,i)=> b.classList.toggle('active', i===idx));
  // علّم الحلقات اللي اتشافت
  let watched = JSON.parse(localStorage.getItem('watched_'+id)||'[]');
  if(!watched.includes(idx)){ watched.push(idx); localStorage.setItem('watched_'+id, JSON.stringify(watched)); }

  buildServers();
  // افتح سيرفر 1 تلقائي مع كل حلقة
  currentServer=0;
  document.querySelectorAll('.server-btn').forEach((b,i)=> b.classList.toggle('active', i===0));
  makePlayer(servers[0]);

  // حدث العنوان
  let ep = movie.episodes[idx];
  document.getElementById('title').innerText = movie.title + (ep ? ` - ${ep.title||'الحلقة '+(idx+1)}` : '');
  updateEpButtons();
}

function updateEpButtons(){
  let watched = JSON.parse(localStorage.getItem('watched_'+id)||'[]');
  document.querySelectorAll('.ep-btn').forEach((b,i)=>{
    if(watched.includes(i) && i!==currentEp) b.classList.add('watched');
  });
}

fetch('movies.json?t='+Date.now())
  .then(res => res.json())
  .then(movies => {
    const list=Array.isArray(movies)?movies:(movies.movies||[]);
    movie = list.find(m => String(m.id) == String(id));
    if(!movie){
      document.getElementById('title').innerText='الفيلم مش موجود';
      document.getElementById('playerWrap').innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#666">الفيلم غير موجود</div>';
      return;
    }
    document.title=movie.title+' - GTM Movies';
    document.getElementById('meta').innerText=(movie.category||'')+' • '+(movie.year||'');
    document.getElementById('desc').innerText=movie.description||'';

    // لو مسلسل اعرض الحلقات
    if(isSeries(movie) && movie.episodes && movie.episodes.length>0){
      document.getElementById('episodesBox').classList.add('show');
      document.getElementById('epCount').innerText=movie.episodes.length+' حلقة';
      document.getElementById('episodesList').innerHTML=movie.episodes.map((ep,i)=>`
        <button class="ep-btn ${i==0?'active':''}" onclick="playEp(${i})">${ep.num||i+1}</button>
      `).join('');
      // لو مفيش episodes بس هو مسلسل، اعمل 1 حلقة وهمية
    }else if(isSeries(movie)){
      document.getElementById('episodesBox').classList.add('show');
      document.getElementById('epCount').innerText='1 حلقة';
      document.getElementById('episodesList').innerHTML='<button class="ep-btn active">1</button>';
    }

    buildServers();
    let dlUrl = movie.download_url || servers[0];
    document.getElementById('dlBtn').href=dlUrl||'#';
    document.getElementById('dlBtn').style.display=dlUrl?'inline-flex':'none';

    let last=parseInt(localStorage.getItem('last_server')||'0');
    setServer(last);
    
    if(movie.episodes && movie.episodes.length>0){
      playEp(0);
      updateEpButtons();
    }else{
      document.getElementById('title').innerText=movie.title;
    }
  })
  .catch(e=>{
    document.getElementById('title').innerText='خطأ في التحميل';
    console.error(e);
  });
</script>
</body>
</html>
