<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTM Movies — Netflix Style</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#141414;
    --black-2:#181818;
    --black-3:#232323;
    --red:#e50914;
    --red-hover:#f40612;
    --white:#ffffff;
    --muted:#808080;
    --muted-2:#b3b3b3;
    --border:#2f2f2f;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--black);
    color:var(--white);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* Scrollbar */
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:var(--black)}
  ::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:#444}

  /* Header - Netflix top nav */
  #siteHeader{
    position:fixed;top:0;left:0;right:0;z-index:100;
    height:68px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 60px;
    background:linear-gradient(180deg, rgba(0,0,0,.7) 10%, transparent);
    transition:background .4s;
  }
  #siteHeader.scrolled{
    background:#141414;
  }
  .nav-left{display:flex;align-items:center;gap:32px}
  .logo{
    font-family:'Bebas Neue', sans-serif;
    font-size:32px;letter-spacing:.5px;
    color:var(--red);text-decoration:none;
    line-height:1;
  }
  .nav-links{display:flex;gap:20px;list-style:none}
  .nav-links a{
    color:#e5e5e5;font-size:14px;font-weight:400;text-decoration:none;
    transition:color .2s;
  }
  .nav-links a:hover,.nav-links a.active{color:var(--white);font-weight:500}
  .nav-right{display:flex;align-items:center;gap:22px}
  .search-wrap{
    position:relative;display:flex;align-items:center;
  }
  #search{
    background:rgba(0,0,0,.75);
    border:1px solid rgba(255,255,255,.5);
    color:#fff;font-size:14px;
    width:240px;padding:8px 40px 8px 36px;
    outline:none;
    transition:width .3s, border-color .3s;
  }
  #search::placeholder{color:var(--muted-2)}
  #search:focus{width:280px;border-color:#fff;background:#000}
  .search-icon{
    position:absolute;left:10px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;pointer-events:none;color:#fff
  }
  .avatar{
    width:32px;height:32px;border-radius:4px;
    background:var(--red);display:grid;place-items:center;
    font-weight:700;font-size:12px;cursor:pointer;
  }

  /* HERO / BILLBOARD - True Netflix */
  .billboard{
    position:relative;
    width:100%;height:92vh;min-height:580px;max-height:900px;
    overflow:hidden;
    background:#000;
  }
  #heroBg{
    position:absolute;inset:0;
    background-size:cover;background-position:center top;
    transform:scale(1.02);
    transition:transform 8s ease;
  }
  .billboard:hover #heroBg{transform:scale(1.06)}
  /* Netflix Vignettes */
  .billboard::before{
    content:'';position:absolute;inset:0;z-index:1;
    background:
      linear-gradient(77deg, rgba(0,0,0,.85) 0%, rgba(0,0,0,.45) 40%, transparent 85%),
      linear-gradient(0deg, #141414 0%, transparent 50%),
      linear-gradient(180deg, rgba(0,0,0,.6) 0%, transparent 20%);
  }
  .billboard-bottom-fade{
    position:absolute;left:0;right:0;bottom:0;height:40%;z-index:2;
    background:linear-gradient(0deg, #141414 0%, rgba(20,20,20,.85) 25%, transparent 100%);
    pointer-events:none;
  }
  #heroContent{
    position:relative;z-index:2;
    height:100%;
    display:flex;flex-direction:column;justify-content:flex-end;
    padding:0 60px 140px;
    max-width:800px;
  }
  .hero-eyebrow{
    display:flex;align-items:center;gap:8px;
    margin-bottom:14px;
  }
  .hero-eyebrow span:first-child{
    font-family:'Bebas Neue';color:var(--muted-2);letter-spacing:4px;font-size:14px;
  }
  .hero-badge{
    background:var(--red);color:#fff;font-size:10px;font-weight:800;letter-spacing:1px;
    padding:2px 6px;border-radius:2px;
  }
  .hero-title{
    font-size: clamp(32px, 4.5vw, 56px);
    font-weight:900;line-height:.95;letter-spacing:-1px;
    text-shadow:2px 2px 4px rgba(0,0,0,.6);
    margin-bottom:16px;
  }
  .hero-meta{
    display:flex;align-items:center;gap:12px;
    color:#fff;font-size:15px;font-weight:500;margin-bottom:16px;
  }
  .hero-meta .match{color:#46d369;font-weight:700}
  .hero-meta .maturity{
    border:1px solid rgba(255,255,255,.4);padding:0 6px;font-size:12px;
  }
  .hero-desc{
    color:#fff;font-size:18px;line-height:1.45;font-weight:400;
    text-shadow:1px 1px 2px rgba(0,0,0,.5);
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
    max-width:540px;margin-bottom:28px;
  }
  .hero-actions{display:flex;gap:12px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    height:44px;padding:0 28px;border-radius:4px;
    font-size:16px;font-weight:700;letter-spacing:.2px;
    border:none;cursor:pointer;transition:all .2s;text-decoration:none;
  }
  .btn-play{background:#fff;color:#000}
  .btn-play:hover{background:rgba(255,255,255,.75)}
  .btn-info{background:rgba(109,109,110,.7);color:#fff;backdrop-filter:blur(2px)}
  .btn-info:hover{background:rgba(109,109,110,.4)}
  .btn svg{width:26px;height:26px}
  .hero-volume{
    position:absolute;right:60px;bottom:130px;z-index:3;
    width:36px;height:36px;border:1px solid rgba(255,255,255,.7);border-radius:50%;
    display:grid;place-items:center;background:transparent;color:rgba(255,255,255,.7);
    cursor:pointer;transition:all .2s;
  }
  .hero-volume:hover{border-color:#fff;color:#fff;background:rgba(0,0,0,.3)}
  .hero-age{
    position:absolute;right:0;bottom:130px;z-index:3;
    display:flex;align-items:center;gap:12px;
  }
  .age-box{
    background:#33333399;border-left:3px solid #dcdcdc;
    padding:4px 36px 4px 12px;font-size:14px;
  }

  /* MAIN */
  main{position:relative;z-index:3;margin-top:-80px;padding:0 0 60px;background:transparent}
  
  /* Chips / Categories - Netflix pill filters? Actually Netflix uses row filters but we keep chips as category nav */
  .chips-wrap{
    padding:0 60px;margin-bottom:18px;
    display:flex;align-items:center;gap:8px;
    overflow-x:auto;scrollbar-width:none;
  }
  .chips-wrap::-webkit-scrollbar{display:none}
  #chips{display:flex;gap:8px}
  .chip{
    white-space:nowrap;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);
    color:#fff;font-size:13px;font-weight:500;
    padding:6px 14px;border-radius:20px;cursor:pointer;
    transition:all .2s;
  }
  .chip:hover{background:rgba(255,255,255,.2)}
  .chip.active{background:#fff;color:#000;border-color:#fff;font-weight:700}

  /* ROWS */
  #rows{display:flex;flex-direction:column;gap:38px;padding:0 0}
  .row-section{position:relative;padding:0 60px}
  .row-header{
    display:flex;align-items:center;gap:10px;margin-bottom:14px;
  }
  .row-red-line{width:3px;height:18px;background:var(--red);border-radius:2px;flex-shrink:0}
  .row-title{
    font-size:21px;font-weight:700;letter-spacing:.2px;color:#e5e5e5;
  }
  .row-title:hover{color:#fff}
  .row-count{color:var(--muted);font-size:13px;margin-left:8px}
  .row-track-wrap{position:relative}
  .row-track{
    display:flex;gap:8px;overflow-x:auto;overflow-y:visible;
    scrollbar-width:none;padding:6px 0 20px;
    scroll-behavior:smooth;
  }
  .row-track::-webkit-scrollbar{display:none}
  .row-arrow{
    position:absolute;top:0;bottom:20px;width:60px;z-index:2;
    background:rgba(20,20,20,.6);border:none;
    color:#fff;font-size:28px;cursor:pointer;
    display:grid;place-items:center;opacity:0;transition:opacity .2s;
  }
  .row-track-wrap:hover .row-arrow{opacity:1}
  .row-arrow:hover{background:rgba(20,20,20,.8)}
  .row-arrow.left{left:0}
  .row-arrow.right{right:0}

  /* CARD - Netflix 2024 true card */
  .card{
    position:relative;flex:0 0 auto;
    width: 260px; /* 16:9ish */
    aspect-ratio:16/9;
    border-radius:4px;overflow:hidden;
    background:var(--black-2);
    cursor:pointer;
    transform-origin:center bottom;
    transition:transform .35s cubic-bezier(.4,0,.2,1), box-shadow .35s, border-color .2s;
    border:1px solid transparent;
  }
  .card img{
    width:100%;height:100%;object-fit:cover;display:block;
    transition:transform .4s;
  }
  .card:hover{
    transform:scale(1.38);
    z-index:10;
    border-color:var(--red);
    box-shadow:0 12px 28px rgba(0,0,0,.8), 0 0 0 1px var(--red);
  }
  .card:hover img{transform:scale(1.05)}
  /* Hover overlay = Netflix expanded */
  .card-overlay{
    position:absolute;inset:auto 0 0 0;
    padding:10px;
    background:linear-gradient(0deg, rgba(0,0,0,.9) 0%, transparent 100%);
    opacity:0;transform:translateY(6px);
    transition:all .3s;
  }
  .card:hover .card-overlay{opacity:1;transform:translateY(0)}
  .card-actions{
    display:flex;gap:6px;margin-bottom:8px;
  }
  .card-icon{
    width:30px;height:30px;border-radius:50%;
    display:grid;place-items:center;
    background:var(--black-3);border:1px solid rgba(255,255,255,.4);
    color:#fff;
  }
  .card-icon.play{background:#fff;color:#000;border-color:#fff}
  .card-title{
    font-size:12px;font-weight:700;line-height:1.2;color:#fff;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card-meta{
    display:flex;align-items:center;gap:5px;margin-top:4px;
  }
  .card-meta span{font-size:10px;color:var(--muted-2)}
  .card-meta .green{color:#46d369;font-weight:700}
  .card-meta .dot{width:3px;height:3px;background:#666;border-radius:50%}
  .card-meta .badge{border:1px solid #777;padding:0 4px;font-size:8px}
  /* Top 10 number */
  .card-rank{
    position:absolute;left:-2px;bottom:-4px;
    font-size:100px;font-weight:900;line-height:.8;
    font-family:'Bebas Neue';
    color:#000;
    -webkit-text-stroke:2px #595959;
    text-stroke:2px #595959;
    z-index:1;pointer-events:none;
  }

  /* Empty / Loading */
  .skeleton-row{display:flex;gap:8px;padding:0 60px}
  .skeleton-card{width:260px;aspect-ratio:16/9;background:#222;border-radius:4px;animation:pulse 1.2s infinite}
  @keyframes pulse{0%{opacity:.6}50%{opacity:1}100%{opacity:.6}}

  /* Footer minimal netflix */
  footer{
    padding:40px 60px 30px;color:#808080;font-size:11px;
    border-top:1px solid #222;
  }
  .footer-links{display:flex;flex-wrap:wrap;gap:12px 24px;margin-bottom:16px;max-width:800px}
  .footer-links a{color:#808080;text-decoration:none}
  .footer-links a:hover{text-decoration:underline}

  /* Responsive */
  @media(max-width:1200px){
    #siteHeader,#heroContent,.row-section,.chips-wrap,footer{padding-left:32px;padding-right:32px}
    .card{width:220px}
  }
  @media(max-width:768px){
    #siteHeader{padding:0 16px;height:56px}
    .nav-links{display:none}
    #search{width:180px}
    .billboard{height:78vh;min-height:460px}
    #heroContent{padding:0 16px 80px}
    .hero-desc{font-size:14px;-webkit-line-clamp:2}
    .hero-actions .btn{height:36px;padding:0 18px;font-size:14px}
    .hero-volume,.hero-age{display:none}
    .row-section{padding:0 16px}
    .chips-wrap{padding:0 16px}
    footer{padding:24px 16px}
    .card{width:168px}
    .card:hover{transform:scale(1.15)}
  }
</style>
</head>
<body>

<header id="siteHeader">
  <div class="nav-left">
    <a class="logo" href="#">GTM MOVIES</a>
    <ul class="nav-links">
      <li><a class="active" href="#">Home</a></li>
      <li><a href="#">TV Shows</a></li>
      <li><a href="#">Movies</a></li>
      <li><a href="#">New & Popular</a></li>
      <li><a href="#">My List</a></li>
      <li><a href="#">Browse by Languages</a></li>
    </ul>
  </div>
  <div class="nav-right">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-3.5-3.5"/></svg>
      <input id="search" type="text" placeholder="Titles, people, genres" autocomplete="off" />
    </div>
    <div class="avatar">G</div>
  </div>
</header>

<div class="billboard" id="billboard">
  <div id="heroBg"></div>
  <div class="billboard-bottom-fade"></div>
  <div id="heroContent">
    <!-- JS will inject -->
    <div class="hero-eyebrow"><span>N</span><span style="color:#b3b3b3;font-size:11px;letter-spacing:3px">SERIES • NETFLIX ORIGINALS STYLE</span></div>
    <h1 class="hero-title">Loading GTM Movies...</h1>
  </div>
  <button class="hero-volume" aria-label="Mute">🔊</button>
  <div class="hero-age"><div class="age-box">16+</div></div>
</div>

<main>
  <div class="chips-wrap"><div id="chips"></div></div>
  <div id="rows">
    <div class="skeleton-row"><div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div></div>
  </div>
</main>

<footer>
  <div class="footer-links">
    <a href="#">Audio Description</a><a href="#">Help Center</a><a href="#">Gift Cards</a><a href="#">Terms of Use</a><a href="#">Privacy</a><a href="#">Corporate Information</a><a href="#">Audio and Subtitles</a><a href="#">Contact GTM</a>
  </div>
  <div>© 1997-2025 GTM Movies, Inc.</div>
</footer>

<script>
// ---- DATA FETCH ----
let ALL_MOVIES = [];
let activeCategory = 'All';

async function loadMovies(){
  try{
    const res = await fetch('movies.json', {cache:'no-store'});
    if(!res.ok) throw new Error('movies.json not found');
    const data = await res.json();
    ALL_MOVIES = Array.isArray(data) ? data : (data.movies || data.results || []);
  }catch(e){
    console.warn('Using demo fallback', e);
    ALL_MOVIES = [
      {id:1,title:"The Night Agent", description:"A low-level FBI agent works in the basement of the White House, manning a phone that never rings — until the night that it does.", genre:"Thriller", year:2024, rating:"95% Match", poster:"https://images.unsplash.com/photo-1485846234645-a62644f84728?w=600", backdrop:"https://images.unsplash.com/photo-1485846234645-a62644f84728?w=1400"},
      {id:2,title:"Red Horizon", description:"When a satellite engineer discovers a hidden signal, world powers race to control the last safe orbital corridor.", genre:"Sci-Fi", year:2024, rating:"92% Match", poster:"https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=600", backdrop:"https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=1400"},
      {id:3,title:"Money Heist Legacy", description:"The professor's next generation plans the impossible.", genre:"Action", year:2023, rating:"98% Match", poster:"https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600", backdrop:"https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1400"},
      {id:4,title:"Dark Waters", description:"Deep sea mystery thriller on the edge of human knowledge.", genre:"Horror", year:2024, rating:"88% Match", poster:"https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600", backdrop:"https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1400"},
      {id:5,title:"The Crown Reign", description:"Power, secrets and elegance — politics has never been so personal.", genre:"Drama", year:2023, rating:"97% Match", poster:"https://images.unsplash.com/photo-1440404653325-ab127d49abc1?w=600", backdrop:"https://images.unsplash.com/photo-1440404653325-ab127d49abc1?w=1400"},
      {id:6,title:"Midnight Loop", description:"Every night he relives the crash. Every morning he tries to stop it.", genre:"Sci-Fi", year:2024, rating:"90% Match", poster:"https://images.unsplash.com/photo-1478720568477-152d9b164e26?w=600", backdrop:"https://images.unsplash.com/photo-1478720568477-152d9b164e26?w=1400"},
      {id:7,title:"Berlin Syndicate", description:"Undercover in Europe's dark finance network.", genre:"Thriller", year:2023, rating:"93% Match", poster:"https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=600", backdrop:"https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1400"},
      {id:8,title:"Comedy Gold", description:"Four friends, one podcast, infinite bad decisions.", genre:"Comedy", year:2024, rating:"85% Match", poster:"https://images.unsplash.com/photo-1522869635100-9f4c5e86aa37?w=600", backdrop:"https://images.unsplash.com/photo-1522869635100-9f4c5e86aa37?w=1400"},
    ];
  }
  init();
}

function getCategories(){
  const set = new Set(ALL_MOVIES.map(m => (m.genre||m.category||'Popular').split(',')[0].trim()));
  return ['All', ...Array.from(set).slice(0,12)];
}

function init(){
  renderChips();
  renderHero();
  renderRows();
  setupSearch();
  setupHeaderScroll();
}

function renderChips(){
  const cats = getCategories();
  const el = document.getElementById('chips');
  el.innerHTML = cats.map(c => `<button class="chip ${c===activeCategory?'active':''}" data-cat="${c}">${c}</button>`).join('');
  el.querySelectorAll('.chip').forEach(b=>{
    b.addEventListener('click', ()=>{
      activeCategory = b.dataset.cat;
      el.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      renderRows();
    });
  });
}

function pickHero(){
  return ALL_MOVIES.find(m=>m.backdrop||m.poster) || ALL_MOVIES[0];
}

function renderHero(){
  const m = pickHero();
  if(!m) return;
  const bg = document.getElementById('heroBg');
  const img = m.backdrop || m.banner || m.poster || m.image || '';
  if(img) bg.style.backgroundImage = `url('${img}')`;

  const content = document.getElementById('heroContent');
  const title = m.title || m.name || 'Untitled';
  const desc = m.description || m.overview || m.plot || 'Watch now on GTM Movies. Top rated original series and blockbuster movies, curated for you.';
  const year = m.year || m.release_year || '2024';
  const rating = m.rating || m.match || '98% Match';
  const genre = (m.genre||'Drama').split(',')[0];

  content.innerHTML = `
    <div class="hero-eyebrow"><span style="color:#e50914;font-family:'Bebas Neue';font-size:22px;margin-right:2px;">N</span><span style="color:#b3b3b3;font-size:11px;letter-spacing:3px;text-transform:uppercase">SERIES • ${genre}</span></div>
    <h1 class="hero-title">${escapeHtml(title)}</h1>
    <div class="hero-meta">
      <span class="match">${escapeHtml(String(rating))}</span>
      <span>${year}</span>
      <span class="maturity">16+</span>
      <span>4K</span>
      <span>HDR</span>
    </div>
    <p class="hero-desc">${escapeHtml(desc)}</p>
    <div class="hero-actions">
      <a class="btn btn-play" href="movie.html?id=${m.id}">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v14l11-7-11-7z"/></svg> Play
      </a>
      <a class="btn btn-info" href="movie.html?id=${m.id}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg> More Info
      </a>
    </div>
  `;
}

function groupByCategory(list){
  const groups = {};
  list.forEach(m=>{
    const g = (m.genre || m.category || 'Popular').split(',')[0].trim() || 'Popular';
    if(!groups[g]) groups[g]=[];
    groups[g].push(m);
  });
  // Ensure stable Netflix order
  const order = ['Trending Now','Top 10','Action','Thriller','Drama','Sci-Fi','Comedy','Horror','Popular'];
  const sortedKeys = Object.keys(groups).sort((a,b)=>{
    let ia = order.indexOf(a); let ib = order.indexOf(b);
    if(ia===-1) ia=999; if(ib===-1) ib=999;
    return ia-ib;
  });
  // Always insert some special rows
  if(list.length>=6){
    groups['Trending Now'] = [...list].sort(()=>.5-Math.random()).slice(0,12);
    groups['Top 10 on GTM Today'] = [...list].slice(0,10);
  }
  const finalOrder = ['Trending Now','Top 10 on GTM Today', ...sortedKeys.filter(k=>!['Trending Now','Top 10 on GTM Today'].includes(k))];
  return {groups, order:finalOrder.filter(k=>groups[k])};
}

function renderRows(filterText=''){
  const container = document.getElementById('rows');
  let list = ALL_MOVIES;
  if(activeCategory!=='All'){
    list = list.filter(m=> (m.genre||'').toLowerCase().includes(activeCategory.toLowerCase()));
  }
  if(filterText){
    const q = filterText.toLowerCase();
    list = list.filter(m=> (m.title||'').toLowerCase().includes(q) || (m.genre||'').toLowerCase().includes(q) || (m.description||'').toLowerCase().includes(q));
  }
  if(!list.length){
    container.innerHTML = `<div style="padding:40px 60px;color:#777">No titles found for "${escapeHtml(filterText||activeCategory)}"</div>`;
    return;
  }
  const {groups, order} = groupByCategory(list);
  container.innerHTML = order.map((cat, idx)=>{
    const movies = groups[cat];
    const isTop10 = cat.toLowerCase().includes('top 10');
    return `
      <section class="row-section">
        <div class="row-header">
          <div class="row-red-line"></div>
          <h2 class="row-title">${escapeHtml(cat)}</h2>
          <span class="row-count">${movies.length} titles</span>
        </div>
        <div class="row-track-wrap">
          <button class="row-arrow left" onclick="scrollRow(this,-1)">‹</button>
          <div class="row-track">
            ${movies.map((m,i)=> cardHtml(m, isTop10?i+1:null)).join('')}
          </div>
          <button class="row-arrow right" onclick="scrollRow(this,1)">›</button>
        </div>
      </section>
    `;
  }).join('');
}

function cardHtml(m, rank){
  const img = m.poster || m.image || m.backdrop || '';
  const title = m.title || m.name || 'Untitled';
  const match = m.rating || m.match || `${Math.floor(85+Math.random()*13)}% Match`;
  const year = m.year || 2024;
  return `
    <a class="card" href="movie.html?id=${m.id}" title="${escapeHtml(title)}">
      ${rank?`<div class="card-rank">${rank}</div>`:''}
      <img loading="lazy" src="${img}" alt="${escapeHtml(title)}" onerror="this.src='https://via.placeholder.com/260x146/181818/e50914?text=${encodeURIComponent(title)}'">
      <div class="card-overlay">
        <div class="card-actions">
          <span class="card-icon play">▶</span>
          <span class="card-icon">+</span>
          <span class="card-icon">♡</span>
          <span class="card-icon" style="margin-left:auto">⌄</span>
        </div>
        <div class="card-title">${escapeHtml(title)}</div>
        <div class="card-meta">
          <span class="green">${escapeHtml(String(match))}</span>
          <span class="dot"></span>
          <span class="badge">16+</span>
          <span class="dot"></span>
          <span>${year}</span>
          <span class="dot"></span>
          <span>HD</span>
        </div>
      </div>
    </a>
  `;
}

function setupSearch(){
  const input = document.getElementById('search');
  let t;
  input.addEventListener('input', ()=>{
    clearTimeout(t);
    t = setTimeout(()=> renderRows(input.value.trim()), 220);
  });
}

function setupHeaderScroll(){
  const h = document.getElementById('siteHeader');
  window.addEventListener('scroll', ()=>{
    if(window.scrollY>10) h.classList.add('scrolled');
    else h.classList.remove('scrolled');
  });
}

function scrollRow(btn, dir){
  const track = btn.parentElement.querySelector('.row-track');
  track.scrollBy({left: dir* (track.clientWidth*0.8), behavior:'smooth'});
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=> ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Kick
loadMovies();
</script>
</body>
</html>
