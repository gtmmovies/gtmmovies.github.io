<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTM ADMIN V10 - افلام ومسلسلات - رفع مباشر</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{font-family:'Cairo',sans-serif;box-sizing:border-box}body{margin:0;background:#060606;color:#fff}
.topbar{height:64px;background:#0e0e0e;border-bottom:1px solid #1f1f1f;display:flex;align-items:center;justify-content:space-between;padding:0 15px;position:sticky;top:0;z-index:100}
.logo{font-weight:800}.logo span{color:#e50914}
.btn-add{background:#e50914;color:#fff;border:none;padding:10px 18px;border-radius:10px;font-weight:700;cursor:pointer}
.container{max-width:1200px;margin:15px auto;padding:0 15px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0;white-space:nowrap}
.tab{padding:8px 16px;border-radius:20px;background:#1a1a1a;border:1px solid #222;color:#aaa;cursor:pointer;font-size:13px;font-weight:600}
.tab.active{background:#e50914;color:#fff;border-color:#e50914}
.search{width:100%;background:#161616;border:1px solid #222;border-radius:12px;padding:12px;color:#fff;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{position:relative;background:#121212;border:1px solid #1f1f1f;border-radius:14px;overflow:hidden}
.card img{width:100%;height:230px;object-fit:cover;background:#111}
.card-body{padding:8px}.card-body b{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-body small{color:#777;font-size:10px;display:block}
.card-actions{position:absolute;top:6px;left:6px;display:flex;gap:5px;z-index:10;background:rgba(0,0,0,.6);padding:4px;border-radius:8px}
.icon-btn{width:30px;height:30px;border-radius:8px;border:none;cursor:pointer;background:rgba(0,0,0,.8);color:#fff;font-size:12px}
.icon-btn.del{background:rgba(229,9,20,.9)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:200;padding:15px}
.modal.active{display:flex}
.modal-box{background:#111;border:1px solid #222;border-radius:20px;width:100%;max-width:560px;max-height:95vh;overflow:auto;padding:20px}
.modal-box input,.modal-box textarea, .modal-box select{width:100%;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:12px;margin:6px 0;color:#fff}
.btn-save{width:100%;background:#e50914;border:none;padding:14px;border-radius:12px;color:#fff;font-weight:800;margin-top:10px;cursor:pointer}
.btn-save:disabled{background:#444}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cat-label{display:flex;gap:6px;align-items:center;background:#222;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12px}
.cat-label:has(input:checked){background:#e50914;color:#fff}
.token-box{display:flex;gap:8px;margin:10px 0;background:#111;padding:10px;border-radius:12px;border:1px solid #222}
.section-title{font-size:13px;color:#e50914;font-weight:800;margin:14px 0 6px 0;border-top:1px solid #222;padding-top:10px}
.typeSel{display:flex;gap:8px;margin:8px 0}
.typeBtn{flex:1;padding:10px;border-radius:10px;border:1px solid #333;background:#1a1a1a;color:#aaa;cursor:pointer;text-align:center;font-weight:800}
.typeBtn.active{background:#e50914;color:#fff;border-color:#e50914}
.epBox{background:#0e0e13;border:1px dashed #333;border-radius:12px;padding:10px;margin-top:8px;max-height:320px;overflow-y:auto}
.epItem{background:#1a1a24;border:1px solid #2a2a2a;border-radius:10px;padding:10px;margin-bottom:10px;position:relative}
.delEp{position:absolute;top:6px;left:6px;background:#e50914;color:#fff;border:0;border-radius:6px;padding:3px 8px;cursor:pointer;font-size:11px}
</style>
</head>
<body>
<div class="topbar">
<div class="logo">GTM <span>V10 حلقات مباشر</span></div>
<button class="btn-add" onclick="openModal()">+ إضافة</button>
</div>
<div class="container">
<div class="token-box">
<input id="ghToken" type="password" placeholder="GitHub Token ghp_..." style="flex:1;background:#1a1a1a;border:1px solid #222;border-radius:10px;padding:10px;color:#fff">
<button onclick="saveToken()" style="background:#e50914;color:#fff;border:none;border-radius:8px;padding:8px 14px;cursor:pointer">حفظ</button>
</div>
<div id="status" style="font-size:12px;color:#888;margin:5px 0"></div>
<div class="tabs">
<button class="tab active" onclick="filterBy('الكل', this)">الكل <span id="c-all"></span></button>
<button class="tab" onclick="filterBy('افلام عربي', this)">عربي</button>
<button class="tab" onclick="filterBy('افلام اجنبي', this)">أجنبي</button>
<button class="tab" onclick="filterBy('مسلسلات', this)">مسلسلات</button>
</div>
<input class="search" id="search" placeholder="🔍 ابحث..." oninput="applyFilter()">
<div class="grid" id="list"></div>
</div>

<div class="modal" id="modal">
<div class="modal-box">
<div style="display:flex;justify-content:space-between"><h3 id="mtitle">إضافة</h3><button onclick="closeModal()" style="background:#222;border:none;color:#fff;width:32px;height:32px;border-radius:8px;cursor:pointer">✕</button></div>

<div class="typeSel">
<div class="typeBtn active" id="typeMovieBtn" onclick="setType('movie')">🎬 فيلم</div>
<div class="typeBtn" id="typeSeriesBtn" onclick="setType('series')">📺 مسلسل</div>
</div>

<input id="title" placeholder="اسم الفيلم / المسلسل">
<input id="year" placeholder="السنة">

<div class="section-title">التصنيفات</div>
<div class="cat-grid">
<label class="cat-label"><input type="checkbox" class="catChk" value="افلام عربي"> افلام عربي</label>
<label class="cat-label"><input type="checkbox" class="catChk" value="افلام اجنبي"> افلام اجنبي</label>
<label class="cat-label"><input type="checkbox" class="catChk" value="مسلسلات"> مسلسلات</label>
<label class="cat-label"><input type="checkbox" class="catChk" value="اكشن"> اكشن</label>
<label class="cat-label"><input type="checkbox" class="catChk" value="كوميدي"> كوميدي</label>
<label class="cat-label"><input type="checkbox" class="catChk" value="رعب"> رعب</label>
<label class="cat-label"><input type="checkbox" class="catChk" value="دراما"> دراما</label>
<label class="cat-label"><input type="checkbox" class="catChk" value="انمي"> انمي</label>
</div>

<div class="section-title">الصورة</div>
<input id="posterUrl" placeholder="لينك البوستر https://...">
<div id="previewWrap" style="display:none"><img id="preview" style="width:100%;border-radius:10px;max-height:200px;object-fit:cover;margin-top:6px"></div>

<div id="movieFields">
<div class="section-title">السيرفرات - فيلم</div>
<input id="video" placeholder="🎬 سيرفر 1">
<input id="video2" placeholder="🎬 سيرفر 2 (اختياري)">
<input id="dl" placeholder="⬇️ رابط التحميل (اختياري)">
</div>

<div id="seriesFields" style="display:none">
<div class="section-title">الحلقات - مسلسل</div>
<div style="font-size:11px;color:#ff8a9a;background:rgba(229,9,20,.1);padding:8px;border-radius:8px;margin-bottom:8px">كل حلقة ليها سيرفر 1 و 2 بتوعها</div>
<div class="epBox" id="epContainer"></div>
<button onclick="addEpisode()" style="width:100%;background:#1e90ff;color:#fff;border:0;padding:10px;border-radius:8px;margin-top:8px;cursor:pointer;font-weight:800">+ اضافة حلقة</button>
<input id="seriesDl" placeholder="⬇️ رابط تحميل المسلسل كامل (اختياري)" style="margin-top:10px">
</div>

<textarea id="desc" placeholder="القصة..." rows="3"></textarea>
<input type="hidden" id="editId">
<button class="btn-save" id="saveBtn" onclick="save()">حفظ ونشر مباشر 🚀</button>
<div id="msg" style="font-size:12px;margin-top:8px"></div>
</div>
</div>

<script>
const REPO_OWNER='gtmmovies', REPO_NAME='gtmmovies.github.io', FILE_PATH='movies.json';
let allData=[], currentCat='الكل', fileSha=null, episodes=[], currentType='movie';
const $=id=>document.getElementById(id);
$('ghToken').value=localStorage.getItem('gh_token')||'';
function saveToken(){ localStorage.setItem('gh_token',$('ghToken').value.trim()); alert('تم حفظ التوكن'); load(); }
function openModal(){ $('modal').classList.add('active') } function closeModal(){ $('modal').classList.remove('active') }
function setType(t){
 currentType=t;
 $('typeMovieBtn').classList.toggle('active',t=='movie');
 $('typeSeriesBtn').classList.toggle('active',t=='series');
 $('movieFields').style.display=t=='movie'?'block':'none';
 $('seriesFields').style.display=t=='series'?'block':'none';
}
$('posterUrl').addEventListener('input',()=>{ if($('posterUrl').value){ $('preview').src=$('posterUrl').value; $('previewWrap').style.display='block'; }else{ $('previewWrap').style.display='none'; } });
function b64Encode(s){return btoa(unescape(encodeURIComponent(s)))} function b64Decode(b){return decodeURIComponent(escape(atob(b)))}
async function ghFetch(path, opts={}){
  let token=(localStorage.getItem('gh_token')||'').trim();
  if(!token) throw new Error('حط التوكن الاول');
  let headers={ Authorization:'Bearer '+token, Accept:'application/vnd.github.v3+json' };
  let res=await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {...opts, headers});
  if(!res.ok){ let t=await res.text(); throw new Error('GitHub '+res.status+': '+t.slice(0,200)); }
  return res.json();
}
async function load(){
  try{
    $('status').innerText='⏳ بيحمل...';
    let data;
    try{
      let jf=await ghFetch(FILE_PATH); fileSha=jf.sha; data=JSON.parse(b64Decode(jf.content.replace(/\n/g,'')));
    }catch(e){
      let r=await fetch(`https://${REPO_OWNER}.github.io/${FILE_PATH}?t=${Date.now()}`); data=await r.json();
      try{ let jf=await ghFetch(FILE_PATH); fileSha=jf.sha; }catch(_){}
    }
    allData=Array.isArray(data)?data:(data.movies||[]);
    $('status').innerText=`✅ ${allData.length} فيلم`; $('c-all').innerText=`(${allData.length})`; applyFilter();
  }catch(e){ $('status').innerText='❌ '+e.message; }
}
function applyFilter(){ let d=[...allData]; if(currentCat!='الكل') d=d.filter(m=>(m.category||'').includes(currentCat)); let q=$('search').value.toLowerCase().trim(); if(q) d=d.filter(m=>(m.title||'').toLowerCase().includes(q)); render(d); }
function render(data){ $('list').innerHTML=data.map(m=>`<div class=card><div class=card-actions><button class=icon-btn onclick="startEdit('${m.id}')">✏️</button><button class=icon-btn del onclick="delMovie('${m.id}')">🗑️</button></div><img src="${m.poster_url||m.poster||''}" loading=lazy><div class=card-body><b>${m.title||''}</b><small>${m.category||''} ${m.episodes?'• 📺'+m.episodes.length:''}</small></div></div>`).join('')||'<div style=grid-column:1/-1;text-align:center;color:#666;padding:40px>فاضي</div>'; }
function filterBy(cat, el){ currentCat=cat; document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); el.classList.add('active'); applyFilter(); }

function addEpisode(data=null){
 let ep=data||{num:episodes.length+1,title:`الحلقة ${episodes.length+1}`,video_url:'',video_url2:''};
 episodes.push(ep);
 renderEpisodes();
}
function renderEpisodes(){
 $('epContainer').innerHTML=episodes.map((ep,i)=>`
  <div class="epItem">
   <button class="delEp" onclick="removeEp(${i})">حذف</button>
   <div style="font-size:12px;color:#e50914;font-weight:800;margin-bottom:6px">الحلقة ${i+1}</div>
   <div style="display:grid;grid-template-columns:1fr 70px;gap:6px">
    <input value="${ep.title}" oninput="episodes[${i}].title=this.value" placeholder="عنوان الحلقة">
    <input type="number" value="${ep.num||i+1}" oninput="episodes[${i}].num=this.value" placeholder="رقم">
   </div>
   <input value="${ep.video_url||''}" oninput="episodes[${i}].video_url=this.value" placeholder="سيرفر 1 الحلقة ${i+1}">
   <input value="${ep.video_url2||''}" oninput="episodes[${i}].video_url2=this.value" placeholder="سيرفر 2 الحلقة ${i+1} (اختياري)">
  </div>
 `).join('');
}
function removeEp(i){episodes.splice(i,1);renderEpisodes();}

function startEdit(id){
  let m=allData.find(x=>String(x.id)==String(id)); if(!m) return;
  $('editId').value=m.id; $('title').value=m.title||''; $('year').value=m.year||''; $('posterUrl').value=m.poster_url||m.poster||''; if($('posterUrl').value){$('preview').src=$('posterUrl').value; $('previewWrap').style.display='block';}
  $('desc').value=m.description||''; document.querySelectorAll('.catChk').forEach(chk=> chk.checked=(m.category||'').includes(chk.value));
  if(m.episodes && m.episodes.length>0){
    setType('series'); episodes=m.episodes.map(e=>({...e})); renderEpisodes(); $('seriesDl').value=m.download_url||'';
  }else{
    setType('movie'); episodes=[]; renderEpisodes(); $('video').value=m.watch_url||m.video_url||''; $('video2').value=m.video_url2||m.server2||''; $('dl').value=m.download_url||'';
  }
  $('mtitle').innerText='تعديل: '+m.title; openModal();
}
async function save(){
  if($('saveBtn').disabled) return;
  if(!$('title').value.trim()) return alert('اسم الفيلم');
  let cats=[...document.querySelectorAll('.catChk:checked')].map(c=>c.value).join(', '); if(!cats) return alert('اختار تصنيف');
  if(!(localStorage.getItem('gh_token')||'').trim()) return alert('حط التوكن');
  $('saveBtn').disabled=true; $('saveBtn').innerText='⏳ بينشر...'; $('msg').innerText='';
  try{
    let posterUrl=$('posterUrl').value.trim(); if(!posterUrl) throw new Error('حط لينك الصورة');
    let payload={
      id: $('editId').value ? String($('editId').value) : String(Date.now()),
      title: $('title').value.trim(),
      year: $('year').value.trim(),
      category: cats,
      poster_url: posterUrl, poster: posterUrl,
      description: $('desc').value.trim()
    };
    if(currentType=='movie'){
      payload.video_url=$('video').value.trim();
      payload.watch_url=$('video').value.trim();
      payload.video_url2=$('video2').value.trim();
      payload.server2=$('video2').value.trim();
      payload.download_url=$('dl').value.trim();
      payload.type='movie';
    }else{
      if(episodes.length==0) throw new Error('ضيف حلقة واحدة على الاقل');
      payload.episodes=episodes.filter(e=>e.video_url).map((e,i)=>({num:parseInt(e.num)||i+1,title:e.title||`الحلقة ${i+1}`,video_url:e.video_url,video_url2:e.video_url2||''}));
      payload.download_url=$('seriesDl').value.trim();
      payload.type='series';
      payload.video_url=payload.episodes[0]?.video_url||'';
      payload.watch_url=payload.episodes[0]?.video_url||'';
      payload.video_url2=payload.episodes[0]?.video_url2||'';
    }
    let newData=$('editId').value?allData.map(m=> String(m.id)==String($('editId').value) ? {...m, ...payload} : m):[payload, ...allData];
    try{ let jf=await ghFetch(FILE_PATH); fileSha=jf.sha; }catch(_){}
    let b64=b64Encode(JSON.stringify(newData,null,2));
    let body={ message:'update '+payload.title, content:b64 }; if(fileSha) body.sha=fileSha;
    await ghFetch(FILE_PATH, { method:'PUT', body: JSON.stringify(body) });
    $('msg').innerText='✅ اتنشر مباشر!'; closeModal(); resetForm(); setTimeout(load,2000);
  }catch(e){ $('msg').innerText='❌ '+e.message; alert(e.message); }
  finally{ $('saveBtn').disabled=false; $('saveBtn').innerText='حفظ ونشر مباشر 🚀'; }
}
function resetForm(){ $('editId').value=''; $('title').value=''; $('year').value=''; $('posterUrl').value=''; $('video').value=''; $('video2').value=''; $('dl').value=''; $('desc').value=''; $('seriesDl').value=''; $('previewWrap').style.display='none'; document.querySelectorAll('.catChk').forEach(c=>c.checked=false); episodes=[]; renderEpisodes(); setType('movie'); }
async function delMovie(id){ if(!confirm('تمسح؟')) return; try{ $('status').innerText='⏳ بيمسح...'; let nd=allData.filter(m=> String(m.id)!=String(id)); try{ let jf=await ghFetch(FILE_PATH); fileSha=jf.sha; }catch(_){} let b64=b64Encode(JSON.stringify(nd,null,2)); await ghFetch(FILE_PATH, { method:'PUT', body: JSON.stringify({ message:'delete '+id, content:b64, sha:fileSha }) }); allData=nd; applyFilter(); $('status').innerText='✅ اتمسح'; }catch(e){ alert(e.message); } }
load();
renderEpisodes();
</script>
</body>
</html>
