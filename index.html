<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-7NKEDGK811"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-7NKEDGK811');</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTM MOVIES</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#050507;color:#fff}
header{position:fixed;top:0;width:100%;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:14px 4%;background:rgba(0,0,0,.7);backdrop-filter:blur(15px)}
.logo{font-size:26px;font-weight:900;color:#fff}.logo span{color:#e50914}
.search input{width:260px;height:40px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#fff;padding:0 15px}
.hero{position:relative;min-height:70vh;display:flex;align-items:flex-end;padding:90px 4% 40px;overflow:hidden}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.5)}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#050507 10%,transparent 70%);z-index:1}
.hero-content{position:relative;z-index:2;max-width:600px}
.badge{display:inline-block;background:rgba(229,9,20,.2);border:1px solid rgba(229,9,20,.4);color:#ff4d5e;padding:4px 10px;border-radius:20px;font-size:12px;margin-bottom:10px}
.hero-content h1{font-size:50px;font-weight:900;line-height:1}
.hero-content p{color:#ccc;margin:10px 0 20px;line-height:1.7}
.btn{display:inline-flex;padding:12px 28px;border-radius:30px;font-weight:800;text-decoration:none;transition:.3s}
.btn-play{background:#fff;color:#000}.btn-info{background:rgba(255,255,255,.15);color:#fff;margin-right:10px}
.chips{padding:15px 4%;display:flex;gap:8px;overflow-x:auto}
.chip{padding:6px 14px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:#aaa;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.active{background:#e50914;color:#fff;border-color:#e50914}
.row{padding:20px 4%}
.row h2{font-size:20px;margin-bottom:12px}
.slider{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px}
.slider::-webkit-scrollbar{display:none}
.card{min-width:165px;width:165px;height:245px;border-radius:12px;overflow:hidden;cursor:pointer;position:relative;border:1px solid rgba(255,255,255,.07);transition:.3s}
.card img{width:100%;height:100%;object-fit:cover}
.card .ov{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.9),transparent 60%);display:flex;align-items:flex-end;padding:10px}
.card .ov b{font-size:12px}
.card:hover{transform:translateY(-6px);border-color:#e50914}
</style>
</head>
<body>
<header><div class="logo"><span>GTM</span> MOVIES</div><div class="search"><input id="search" placeholder="ابحث..." oninput="doSearch()"></div></header>
<div class="hero" id="hero"><div class="hero-bg" id="heroBg"></div><div class="hero-content" id="heroContent"></div></div>
<div class="chips" id="chips"></div>
<div id="rows" style="padding:40px 4%;color:#666">جاري التحميل...</div>
<script>
let allMovies=[];
function getCats(m){return (m.category||'افلام').split(',').map(s=>s.trim()).filter(Boolean);}
function getAllCats(list){let s=new Set();list.forEach(m=>getCats(m).forEach(c=>s.add(c)));return [...s];}
async function fetchMovies(){
 try{let r=await fetch('./movies.json?v='+Date.now(),{cache:'no-store'});if(r.ok){let j=await r.json();return Array.isArray(j)?j:j.movies||[];}}catch(e){}
 return [];
}
async function load(){
 allMovies=await fetchMovies();
 let cats=['الكل',...getAllCats(allMovies)];
 document.getElementById('chips').innerHTML=cats.map(c=>`<div class="chip ${c=='الكل'?'active':''}" onclick="filterCat('${c.replace(/'/g,"\\'")}')">${c}</div>`).join('');
 const m0=allMovies[0];
 if(m0){
  document.getElementById('heroBg').style.backgroundImage=`url('${m0.poster_url||m0.poster}')`;
  document.getElementById('heroContent').innerHTML=`
   <div class="badge">${getCats(m0)[0]||'حصري'}</div>
   <h1>${m0.title}</h1>
   <p>${(m0.description||'').slice(0,120)}</p>
   <a class="btn btn-play" href="movie.html?id=${m0.id}">▶ مشاهدة الان</a>
   <a class="btn btn-info" href="movie.html?id=${m0.id}">معلومات</a>
  `;
 }
 render(allMovies);
}
function card(m){
 // هنا التعديل المهم: بيودي على movie.html مش watch.html
 return `<div class="card" onclick="location.href='movie.html?id=${m.id}'"><img src="${m.poster_url||m.poster}" loading="lazy"><div class="ov"><b>${m.title}</b></div></div>`;
}
function sliderHtml(arr){return `<div class="slider">${arr.map(card).join('')}</div>`;}
function render(list){
 let cats=getAllCats(list);
 let h=`<div class="row"><h2>🔥 أحدث الإضافات</h2>${sliderHtml(list.slice(0,10))}</div>`;
 cats.forEach(cat=>{
  let arr=list.filter(m=>getCats(m).includes(cat));
  if(arr.length>0) h+=`<div class="row"><h2>${cat}</h2>${sliderHtml(arr)}</div>`;
 });
 document.getElementById('rows').innerHTML=h;
}
function filterCat(c){
 document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.textContent==c));
 if(c=='الكل') render(allMovies); else render(allMovies.filter(m=>getCats(m).includes(c)));
}
function doSearch(){
 let q=document.getElementById('search').value.toLowerCase();
 if(!q){render(allMovies);document.getElementById('hero').style.display='';return;}
 let f=allMovies.filter(m=>(m.title||'').toLowerCase().includes(q));
 document.getElementById('hero').style.display='none';
 document.getElementById('rows').innerHTML=`<div class="row"><h2>نتائج: ${f.length}</h2>${sliderHtml(f)}</div>`;
}
load();
</script>
</body>
</html>
