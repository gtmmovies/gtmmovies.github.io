<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>من نحن - GTM Movies</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@900&display=swap" rel="stylesheet">
<style>
*{margin:0;font-family:'Cairo',sans-serif;box-sizing:border-box}
body{background:#000;color:#fff;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center}
.scene{position:fixed;inset:0;perspective:600px;z-index:-1}
.wall{position:absolute;inset:-50%;background: 
linear-gradient(#ff003c 2px, transparent 2px),
linear-gradient(90deg, #ff003c 2px, transparent 2px);
background-size:80px 80px;transform:rotateX(60deg) translateY(-200px) translateZ(-300px);animation:grid 8s linear infinite;opacity:0.15}
@keyframes grid{0%{transform:rotateX(60deg) translateY(0) translateZ(-300px)}100%{transform:rotateX(60deg) translateY(80px) translateZ(-300px)}}
.glow{position:absolute;width:600px;height:600px;background:radial-gradient(circle,#ff003c55,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);filter:blur(40px);animation:pulse 3s infinite}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.3)}}
.card{width:90%;max-width:750px;background:rgba(10,10,10,0.8);border:1px solid #ff003c55;border-radius:20px;padding:40px;backdrop-filter:blur(20px);box-shadow:0 0 50px #ff003c33, inset 0 0 20px #ffffff0a;transform:rotateY(-5deg);animation:cardFloat 5s ease-in-out infinite}
@keyframes cardFloat{0%,100%{transform:rotateY(-5deg) translateY(0)}50%{transform:rotateY(5deg) translateY(-15px)}}
h1{font-size:70px;line-height:0.9;font-weight:900;letter-spacing:-3px}
h1 .a{color:#fff;text-shadow:0 0 20px #fff} h1 .b{color:#ff003c;text-shadow:0 0 30px #ff003c, 0 0 60px #ff003c}
.line{height:3px;background:linear-gradient(90deg,#ff003c,#ff8a00);margin:20px 0;box-shadow:0 0 10px #ff003c;width:0;animation:grow 2s forwards 0.5s}
@keyframes grow{to{width:100%}}
p{color:#aaa;font-size:16px;line-height:1.9;margin-top:15px}
.stats{display:flex;gap:15px;margin-top:25px}
.stat{flex:1;background:#111;border:1px solid #222;padding:15px;border-radius:12px;text-align:center;transform:translateZ(0);transition:0.3s}
.stat:hover{transform:translateY(-5px) scale(1.05);border-color:#ff003c;box-shadow:0 10px 30px #ff003c33}
.stat h2{color:#ff003c;font-size:28px} .stat span{font-size:12px;color:#666}
.btn{display:inline-block;margin-top:25px;background:#fff;color:#000;padding:12px 35px;border-radius:0;font-weight:900;letter-spacing:1px;text-decoration:none;clip-path:polygon(10% 0,100% 0,90% 100%,0 100%);transition:0.3s}
.btn:hover{background:#ff003c;color:#fff;transform:skew(-5deg) scale(1.1);box-shadow:0 0 30px #ff003c}
</style>
</head>
<body>
<div class="scene"><div class="wall"></div><div class="glow"></div></div>
<div class="card">
<h1><span class="a">GTM</span> <span class="b">MOVIES</span></h1>
<div class="line"></div>
<p>موقع أفلام معمول في القاهرة، بس بجودة هوليوود. لا إعلانات، لا قرف، بس أفلام.</p>
<p>احنا بنكره المواقع البطيئة زيك بالظبط، عشان كده عملنا الموقع اللي نفسنا نتفرج عليه.</p>
<div class="stats">
<div class="stat"><h2>+5K</h2><span>فيلم</span></div>
<div class="stat"><h2>4K</h2><span>جودة حقيقية</span></div>
<div class="stat"><h2>0</h2><span>إعلانات مزعجة</span></div>
</div>
<a class="btn" href="/">شغل الفيلم ▶</a>
</div>
</body>
</html>
