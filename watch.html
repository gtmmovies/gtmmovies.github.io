<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTM Movies - مشاهدة</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:sans-serif;margin:0}
.nav{padding:15px;background:#141414;color:#e50914;font-weight:bold;font-size:22px}
.container{max-width:900px;margin:auto;padding:15px}
.player{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.player video{width:100%;height:100%}
.info{background:#1a1a1a;padding:20px;border-radius:12px;margin-top:15px}
a.back{display:inline-block;margin-top:10px;background:#e50914;color:#fff;padding:10px 18px;border-radius:8px;text-decoration:none}
</style>
</head>
<body>
<div class="nav">GTM MOVIES</div>
<div class="container">
  <div class="player"><video id="videoFrame" controls autoplay playsinline></video></div>
  <div class="info">
    <h1 id="title">جاري التحميل...</h1>
    <p id="desc"></p>
    <a class="back" href="index.html">← رجوع</a>
  </div>
</div>
<script>
const id = new URLSearchParams(window.location.search).get('id');
fetch('movies.json')
  .then(res => res.json())
  .then(movies => {
    const movie = movies.find(m => m.id == id);
    if(!movie){ document.getElementById('title').innerText='الفيلم مش موجود'; return; }
    document.getElementById('title').innerText = movie.title;
    document.getElementById('desc').innerText = movie.description;
    document.getElementById('videoFrame').src = movie.video_url;
  });
</script>
</body>
</html>
