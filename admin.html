<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIDI GABER - FIXED</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{font-family:'Cairo',sans-serif;box-sizing:border-box}
body{margin:0;background:#060606;color:#fff}
.topbar{height:64px;background:#0e0e0e;border-bottom:1px solid #1f1f1f;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100}
.logo{font-weight:800;font-size:20px;letter-spacing:1px}.logo span{color:#e50914}
.stats{display:flex;gap:12px;padding:20px;max-width:1100px;margin:auto}
.stat{flex:1;background:linear-gradient(145deg,#151515,#0f0f0f);border:1px solid #222;border-radius:16px;padding:16px}
.stat b{font-size:28px;display:block;color:#e50914}.stat small{color:#888}
.toolbar{max-width:1100px;margin:0 auto;padding:0 20px;display:flex;gap:10px;align-items:center}
.search{flex:1;background:#161616;border:1px solid #222;border-radius:12px;padding:12px 14px;color:#fff;outline:none}
.search:focus{border-color:#e50914}
.btn-add-main{background:#e50914;color:#fff;border:none;padding:12px 22px;border-radius:12px;font-weight:700;cursor:pointer}
.container{max-width:1100px;margin:20px auto;padding:0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{position:relative;background:#121212;border:1px solid #1f1f1f;border-radius:16px;overflow:hidden;transition:.2s}
.card:hover{transform:translateY(-4px);border-color:#e50914;box-shadow:0 10px 30px rgba(229,9,20,.25)}
.card img{width:100%;height:260px;object-fit:cover}
.card-body{padding:10px}.card-body b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-body small{color:#888;font-size:11px}
/* FIX 1: تم تصليح مشكلة زرار التعديل اللي مكنش بيظهر */
.card-actions{position:absolute;top:8px;left:8px;display:flex;gap:6px;opacity:0;transition:.2s;z-index:10}
.card:hover .card-actions{opacity:1} /* كان مكتوب .card:hover.card-actions بدون مسافة فمكنش بيظهر */
.icon-btn{width:32px;height:32px;border-radius:8px;border:none;cursor:pointer;background:rgba(0,0,0,.85);color:#fff;backdrop-filter:blur(6px);font-size:14px}
.icon-btn:hover{background:#e50914}
.icon-btn.del:hover{background:#ff0000}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:200;padding:15px}
.modal.active{display:flex}
.modal-box{background:#111;border:1px solid #222;border-radius:20px;width:100%;max-width:500px;max-height:90vh;overflow:auto;padding:20px}
.modal-box h3{margin:0 0 10px}
.modal-box input,.modal-box select,.modal-box textarea{width:100%;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:12px;margin:7px 0;color:#fff;outline:none}
.modal-box input:focus{border-color:#e50914}
.upload{border:2px dashed #2a2a2a;border-radius:12px;padding:18px;text-align:center;cursor:pointer;margin:8px 0;display:block}
.upload:hover{border-color:#e50914}
#preview{width:100%;border-radius:12px;display:none;margin-top:8px;max-height:250px;object-fit:cover}
.btn-save{width:100%;background:linear-gradient(90deg,#e50914,#ff2535);border:none;padding:14px;border-radius:12px;color:#fff;font-weight:800;font-size:16px;margin-top:10px;cursor:pointer;transition:.2s}
.btn-save:disabled{background:#444;cursor:not-allowed;opacity:.6}
#msg{font-size:12px;margin-top:8px;white-space:pre-wrap}
.token-mini{background:#0e0e0e;border:1px solid #1f1f1f;border-radius:12px;padding:10px;margin-bottom:15px;display:flex;gap:8px}
.token-mini input{margin:0;flex:1;background:transparent;border:none;padding:6px}
</style>
</head>
<body>
<div class="topbar">
<div class="logo">GTM MOVIES <span>SIDI GABER</span> 13 FIXED</div>
<div style="display:flex;gap:8px">
<button class="btn-add-main" onclick="openModal()">+ إضافة فيلم</button>
<a href="/" style="background:#1a1a1a;color:#fff;padding:10px 14px;border-radius:10px;text-decoration:none">👁 الموقع</a>
</div>
</div>

<div class="stats">
<div class="stat"><b id="totalMovies">0</b><small>إجمالي الأفلام</small></div>
<div class="stat"><b id="totalAr">0</b><small>أفلام عربي</small></div>
<div class="stat"><b id="totalEn">0</b><small>أفلام أجنبي</small></div>
<div class="stat" style="background:linear-gradient(145deg,#1a0a0a,#150505);border-color:#3a1111"><b style="color:#fff" id="ghStatus">●</b><small>حالة GitHub</small></div>
</div>

<div class="toolbar">
<input class="search" id="search" placeholder="🔍 ابحث عن فيلم..." oninput="filterMovies()">
<div class="token-mini" style="margin:0">
<input id="ghToken" type="password" placeholder="الباسورد ينجم">
<button onclick="saveToken()" style="background:#222;color:#fff;border:none;border-radius:8px;padding:6px 10px;cursor:pointer">حفظ</button>
</div>
</div>

<div class="container">
<div class="grid" id="list"></div>
</div>

<div class="modal" id="modal">
<div class="modal-box">
<div style="display:flex;justify-content:space-between;align-items:center"><h3 id="modalTitle">إضافة فيلم جديد</h3><button onclick="closeModal()" style="background:#222;border:none;color:#fff;width:32px;height:32px;border-radius:8px;cursor:pointer">✕</button></div>
<input id="title" placeholder="اسم الفيلم">
<div style="display:flex;gap:8px"><input id="year" placeholder="السنة"><select id="category"><option>افلام عربي</option><option>افلام اجنبي</option><option>اكشن</option><option>كوميدي</option><option>رعب</option><option>دراما</option><option>انمي</option><option>مسلسلات</option></select></div>
<label class="upload" for="file"><span id="uploadText">📸 اسحب الصورة هنا أو اضغط</span><input type="file" id="file" accept="image/*" hidden></label>
<img id="preview">
<input id="video" placeholder="رابط المشاهدة (لازم لينك حقيقي)">
<textarea id="desc" placeholder="القصة..." rows="3"></textarea>
<input type="hidden" id="editId">
<button class="btn-save" id="saveBtn" onclick="save()">حفظ ونشر تلقائي 🚀</button>
<div id="msg"></div>
</div>
</div>

<script>
const supa=supabase.createClient('https://akkroydgqotbavvchiju.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFra3JveWRncW90YmF2dmNoaWp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MjY2MDcsImV4cCI6MjEwMjAwMjYwN30.lP10UuBAudqfOeoSpOkfHOXMR1Z24kY68CRNmKUcXpo');
let base64Image="", allData=[];
const REPO_OWNER='gtmmovies', REPO_NAME='gtmmovies.github.io', FILE_PATH='movies.json';
const ghToken=document.getElementById('ghToken');
ghToken.value=localStorage.getItem('gh_token')||'';
if(ghToken.value){ document.getElementById('ghStatus').innerHTML='✅ متصل'; document.getElementById('ghStatus').style.color='#0f0'; }
function saveToken(){ localStorage.setItem('gh_token',ghToken.value.trim()); document.getElementById('ghStatus').innerHTML='✅ متصل'; document.getElementById('ghStatus').style.color='#0f0'; alert('تم الحفظ'); }
function openModal(){ document.getElementById('modal').classList.add('active'); }
function closeModal(){ document.getElementById('modal').classList.remove('active'); }
document.getElementById('file').addEventListener('change',async()=>{
  let f=document.getElementById('file').files[0]; if(!f) return;
  document.getElementById('uploadText').innerText='⏳ بنصغر الصورة...';
  // FIX 2: تصغير الصورة عشان متاخدش وقت
  base64Image = await compressImage(f);
  document.getElementById('preview').src=base64Image;
  document.getElementById('preview').style.display='block';
  document.getElementById('uploadText').innerText='✅ '+f.name+' (تم التصغير)';
});

// دالة تصغير الصورة
function compressImage(file){
  return new Promise(resolve=>{
    let reader=new FileReader();
    reader.onload=e=>{
      let img=new Image();
      img.onload=()=>{
        let canvas=document.createElement('canvas');
        let maxW=500; // تصغير لعرض 500px
        let scale=maxW/img.width;
        canvas.width=maxW;
        canvas.height=img.height*scale;
        let ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',0.7)); // جودة 70%
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function updateGitHubJson(){
 let token=localStorage.getItem('gh_token'); if(!token){ document.getElementById('msg').innerText='⚠ حط التوكن الأول'; return; }
 try{
  document.getElementById('msg').innerText='⏳ ينشر على GitHub...';
  let {data}=await supa.from('movies').select('id,title,description,poster_url,category,year,video_url,watch_url,created_at').order('id',{ascending:false});
  let b64=btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));
  let getRes=await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`,{headers:{Authorization:`Bearer ${token}`}});
  let sha=null; if(getRes.ok){ let j=await getRes.json(); sha=j.sha; }
  let putRes=await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`,{method:'PUT',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({message:'update '+new Date().toISOString(),content:b64,sha})});
  document.getElementById('msg').innerText=putRes.ok?'✅ اتنشر وهيظهر بعد دقيقة':'❌ فشل: '+(await putRes.text()).slice(0,150);
 }catch(e){ document.getElementById('msg').innerText='❌ '+e.message; }
}

let isSaving=false;
async function save(){
 if(isSaving) return; // FIX 3: منع التكرار
 if(!document.getElementById('title').value) return alert('اكتب اسم الفيلم');
 let poster=base64Image; 
 if(!poster && !document.getElementById('editId').value) return alert('اختار الصورة');
 
 isSaving=true;
 let btn=document.getElementById('saveBtn');
 btn.disabled=true;
 btn.innerHTML='⏳ بننشر... متدوسش تاني';

 let payload={
   title:document.getElementById('title').value,
   year:document.getElementById('year').value,
   category:document.getElementById('category').value,
   poster_url:poster||window.oldPoster,
   video_url:document.getElementById('video').value,
   watch_url:document.getElementById('video').value,
   description:document.getElementById('desc').value
 };
 let res=document.getElementById('editId').value?await supa.from('movies').update(payload).eq('id',document.getElementById('editId').value):await supa.from('movies').insert([payload]);
 if(res.error){ document.getElementById('msg').innerText=res.error.message; btn.disabled=false; btn.innerHTML='حفظ ونشر تلقائي 🚀'; isSaving=false; return; }
 await updateGitHubJson(); 
 closeModal(); resetForm(); load();
 btn.disabled=false; btn.innerHTML='حفظ ونشر تلقائي 🚀'; isSaving=false;
}
function resetForm(){ 
  document.getElementById('editId').value='';
  document.getElementById('title').value='';
  document.getElementById('year').value='';
  document.getElementById('video').value='';
  document.getElementById('desc').value='';
  document.getElementById('file').value='';
  document.getElementById('preview').style.display='none';
  base64Image='';
  document.getElementById('uploadText').innerText='📸 اسحب الصورة هنا أو اضغط';
  document.getElementById('modalTitle').innerText='إضافة فيلم جديد';
}
async function load(){
 let {data}=await supa.from('movies').select('*').order('id',{ascending:false}); allData=data||[];
 document.getElementById('totalMovies').innerText=allData.length;
 document.getElementById('totalAr').innerText=allData.filter(m=>m.category?.includes('عربي')).length;
 document.getElementById('totalEn').innerText=allData.filter(m=>m.category?.includes('اجنبي')).length;
 render(allData);
}
function render(data){
 document.getElementById('list').innerHTML=data.map(m=>`<div class="card"><div class="card-actions"><button class="icon-btn" onclick="startEdit(${m.id})" title="تعديل">✏️</button><button class="icon-btn del" onclick="del(${m.id})" title="مسح">🗑️</button></div><img src="${m.poster_url}" loading="lazy"><div class="card-body"><b>${m.title}</b><small>${m.category} • ${m.year||''}</small></div></div>`).join('');
}
function filterMovies(){ let q=document.getElementById('search').value.toLowerCase(); render(allData.filter(m=>m.title.toLowerCase().includes(q))); }
function startEdit(id){ 
  let m=allData.find(x=>x.id==id); 
  document.getElementById('editId').value=m.id; 
  document.getElementById('title').value=m.title; 
  document.getElementById('year').value=m.year; 
  document.getElementById('category').value=m.category; 
  document.getElementById('video').value=m.video_url; 
  document.getElementById('desc').value=m.description; 
  window.oldPoster=m.poster_url; 
  document.getElementById('preview').src=m.poster_url; 
  document.getElementById('preview').style.display='block'; 
  base64Image=m.poster_url; 
  document.getElementById('modalTitle').innerText='تعديل: '+m.title; 
  openModal(); 
}
async function del(id){ 
  if(!confirm('متأكد عايز تمسح الفيلم ده؟')) return; 
  let {error}=await supa.from('movies').delete().eq('id',id);
  if(error){ alert(error.message); return; }
  load(); 
  let token=localStorage.getItem('gh_token'); 
  if(token) updateGitHubJson(); 
}
load();
</script>
</body>
</html>
