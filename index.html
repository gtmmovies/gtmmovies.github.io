<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-7NKEDGK811"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-7NKEDGK811');</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTM MOVIES - مشاهدة افلام عربي واجنبي ومسلسلات مجانا</title>
<meta name="description" content="GTM Movies - شاهد احدث الافلام العربي والاجنبي والمسلسلات والانمي بجودة عالية مجانا">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
:root{--red:#ff153f;--bg:#060608;--card:#121218;--line:rgba(255,255,255,.08)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:var(--bg);color:#fff;overflow-x:hidden}
header{position:fixed;top:0;width:100%;height:70px;padding:0 4%;display:flex;align-items:center;justify-content:space-between;z-index:50;background:linear-gradient(180deg,rgba(0,0,0,.9),transparent);transition:.3s}
header.scrolled{background:rgba(8,8,12,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);height:64px}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:22px;letter-spacing:1px;cursor:pointer}
.logo span{background:#fff;color:#000;padding:2px 6px;border-radius:5px;margin-left:3px}
.search{position:relative;width:320px}
.search input{width:100%;height:42px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:30px;padding:0 42px 0 16px;color:#fff;outline:none;backdrop-filter:blur(10px);transition:.2s}
.search input:focus{border-color:var(--red);background:rgba(255,255,255,.09);box-shadow:0 0 0 4px rgba(255,21,63,.15)}
.search:before{content:"⌕";position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:20px;color:#888}
.hero{height:88vh;min-height:620px;position:relative;display:flex;align-items:center;padding:0 4%;overflow:hidden}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 25%;transform:scale(1.05)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#060608 0%,#060608 20%,rgba(6,6,8,.75) 45%,rgba(6,6,8,.1) 80%),linear-gradient(0deg,#060608 0%,transparent 55%,rgba(0,0,0,.3))}
.hero-content{position:relative;z-index:2;max-width:640px;margin-top:60px}
.live{display:inline-flex;align-items:center;gap:8px;background:rgba(255,21,63,.12);border:1px solid rgba(255,21,63,.25);color:var(--red);padding:6px 12px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:1px;margin-bottom:16px}
.dot{width:7px;height:7px;background:var(--red);border-radius:50%;box-shadow:0 0 10px var(--red);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hero-title{font-size:clamp(36px,6vw,72px);font-weight:900;line-height:.95;letter-spacing:-1px;margin-bottom:14px;text-transform:uppercase}
.hero-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.badge{padding:5px 12px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);font-size:11px;font-weight:700;color:#aaa}
.badge.year{background:#fff;color:#000;border-color:#fff;font-weight:900}
.hero-desc{color:#999;line-height:1.8;font-size:14px;margin-bottom:24px;max-width:520px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.btns{display:flex;gap:10px}
.btn{padding:12px 24px;border-radius:10px;font-weight:800;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:.25s;border:1px solid transparent}
.btn-play{background:#fff;color:#000}
.btn-play:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(255,255,255,.2)}
.btn-info{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.12);backdrop-filter:blur(10px)}
.btn-info:hover{background:rgba(255,255,255,.14)}

.chips{position:sticky;top:64px;z-index:20;display:flex;gap:8px;padding:14px 4%;background:rgba(6,6,8,.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.04);overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 18px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);color:#777;font-size:13px;font-weight:700;cursor:pointer;transition:.2s}
.chip.active{background:#fff;color:#000;border-color:#fff;font-weight:900}
.chip:hover{color:#fff;border-color:rgba(255,255,255,.15)}

.rows{padding:20px 0}
.row{margin-bottom:10px}
.row-head{display:flex;align-items:center;justify-content:space-between;padding:0 4%;margin-bottom:14px}
.row-head h2{font-size:17px;font-weight:900;display:flex;align-items:center;gap:8px}
.row-head h2 i{width:3px;height:18px;background:var(--red);border-radius:4px;display:inline-block}
.row-head a{font-size:11px;color:#555;text-decoration:none}
.slider{display:flex;gap:12px;overflow-x:auto;padding:0 4% 30px;scrollbar-width:none;scroll-behavior:smooth}
.slider::-webkit-scrollbar{display:none}
.card{min-width:180px;width:180px;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid rgba(255,255,255,.06);cursor:pointer;transition:.35s cubic-bezier(.2,.8,.2,1);position:relative}
.card:hover{transform:translateY(-8px) scale(1.02);border-color:rgba(255,255,255,.15);box-shadow:0 20px 40px rgba(0,0,0,.5)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;transition:.5s}
.card:hover img{transform:scale(1.05)}
.card-info{padding:10px 10px 12px}
.card-info b{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.card-info small{font-size:10px;color:#666;margin-top:3px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);width:44px;height:44px;background:rgba(255,255,255,.9);color:#000;border-radius:50%;display:grid;place-items:center;font-size:14px;opacity:0;transition:.3s;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.card:hover .play{opacity:1;transform:translate(-50%,-50%) scale(1)}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.6),transparent 40%);opacity:0;transition:.3s;pointer-events:none}
.card:hover::after{opacity:1}

@media(max-width:700px){
 header{padding:0 3%;height:60px}.logo{font-size:18px}.search{width:180px}.search input{height:36px;font-size:12px}
 .hero{height:72vh;min-height:500px;padding:0 3%}.hero-title{font-size:32px}.hero-desc{display:none}.btn{padding:10px 16px;font-size:12px}
 .card{min-width:135px;width:135px;border-radius:10px}.card-info b{font-size:11px}
 .chips{top:60px;padding:10px 3%}.row-head{padding:0 3%}.slider{padding:0 3% 24px}
}
footer{border-top:1px solid rgba(255,255,255,.06);padding:30px 4%;text-align:center;color:#555;font-size:12px;margin-top:20px}
footer a{color:#777;text-decoration:none;margin:0 10px}footer a:hover{color:#fff}
</style>
</head>
<body>
<header id="siteHeader">
 <div class="logo" onclick="location.href='index.html'"><span>GTM</span> MOVIES</div>
 <div class="search"><input id="search" placeholder="ابحث عن فيلم..." oninput="doSearch()"></div>
</header>

<div class="hero" id="hero">
 <div class="hero-bg" id="heroBg"></div>
 <div class="hero-content" id="heroContent"></div>
</div>

<div class="chips" id="chips"></div>
<div class="rows" id="rows"><div style="padding:60px 4%;color:#555">🎬 جاري تحميل الأفلام...</div></div>

<footer>
 <div>
  <a href="about.html">من نحن</a> | <a href="contact.html">اتصل بنا</a> | <a href="privacy.html">سياسة الخصوصية</a>
 </div>
 <p style="margin-top:12px">© 2026 GTM Movies • مشاهدة مجانية بجودة عالية</p>
</footer>

<script>
let allMovies=[];
function getCats(m){return (m.category||'افلام').split(',').map(s=>s.trim()).filter(Boolean);}
function getAllCats(list){let set=new Set();list.forEach(m=>getCats(m).forEach(c=>set.add(c)));return [...set];}
async function fetchMovies(){
  try{
    let r=await fetch('./movies.json?v='+Date.now(),{cache:'no-store'});
    if(r.ok){
      let j=await r.json();
      let list=Array.isArray(j)?j:j.movies||[];
      if(list.length>0) return list;
    }
  }catch(e){}
  return [];
}
async function load(){ allMovies=await fetchMovies(); paint(); }
function paint(){
 let cats=['الكل',...getAllCats(allMovies)];
 document.getElementById('chips').innerHTML=cats.map(c=>`<div class="chip ${c=='الكل'?'active':''}" onclick="filterCat('${c.replace(/'/g,"\\'")}')">${c}</div>`).join('');
 const m0=allMovies[0];
 if(m0){
  document.getElementById('heroBg').style.backgroundImage=`url('${m0.poster_url||m0.poster||''}')`;
  let badges=getCats(m0).map(c=>`<span class="badge">${c}</span>`).join('');
  document.getElementById('heroContent').innerHTML=`
   <div class="live"><div class="dot"></div> NOW TRENDING #1</div>
   <h1 class="hero-title">${m0.title}</h1>
   <div class="hero-meta"><span class="badge year">${m0.year||'2025'}</span>${badges}</div>
   <p class="hero-desc">${m0.description||''}</p>
   <div class="btns">
     <a class="btn btn-play" href="movie.html?id=${m0.id}">▶ تشغيل الآن</a>
     <a class="btn btn-info" href="movie.html?id=${m0.id}">ⓘ التفاصيل</a>
   </div>`;
 }
 render(allMovies);
}
function card(m){
 return `<div class="card" onclick="location.href='movie.html?id=${m.id}'">
   <img src="${m.poster_url||m.poster||''}" loading="lazy" alt="${m.title}">
   <div class="play">▶</div>
   <div class="card-info"><b>${m.title}</b><small>${m.year||''} • ${getCats(m)[0]||''}</small></div>
  </div>`;
}
function render(list){
 let cats=getAllCats(list);
 let h=`<div class="row"><div class="row-head"><h2><i></i> أحدث الإضافات</h2></div><div class="slider">${list.slice(0,12).map(card).join('')}</div></div>`;
 cats.forEach(cat=>{
  let arr=list.filter(m=>getCats(m).includes(cat));
  if(arr.length>0) h+=`<div class="row"><div class="row-head"><h2><i></i> ${cat}</h2><a>عرض الكل ←</a></div><div class="slider">${arr.map(card).join('')}</div></div>`;
 });
 document.getElementById('rows').innerHTML=h||'<div style="padding:40px;text-align:center;color:#666">لا يوجد افلام</div>';
}
function filterCat(c){
 document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.textContent==c));
 if(c=='الكل') render(allMovies);
 else render(allMovies.filter(m=>getCats(m).includes(c)));
 window.scrollTo({top:document.getElementById('rows').offsetTop-90,behavior:'smooth'});
}
let searchTimer;
function doSearch(){
 clearTimeout(searchTimer);
 searchTimer=setTimeout(()=>{
  let q=document.getElementById('search').value.trim().toLowerCase();
  if(!q){paint();document.getElementById('hero').style.display='';return;}
  let f=allMovies.filter(m=>(m.title||'').toLowerCase().includes(q));
  document.getElementById('hero').style.display='none';
  document.getElementById('rows').innerHTML=`<div class="row"><div class="row-head"><h2><i></i> نتائج البحث: ${f.length}</h2></div><div class="slider" style="flex-wrap:wrap">${f.map(card).join('')}</div></div>`;
 },180);
}
window.addEventListener('scroll',()=>{document.getElementById('siteHeader').classList.toggle('scrolled',window.scrollY>12);});
load();
</script>
</body>
</html>
