<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTM Movies - 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--black:#070709;--black2:#101011;--red:#e50914;--white:#fff;--muted:#9a9a9a}
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--black);color:#fff;font-family:'Cairo','Tajawal',sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:#000}::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
  #siteHeader{position:fixed;top:0;right:0;left:0;z-index:100;height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 3%;background:linear-gradient(180deg,rgba(0,0,0,.85),transparent);transition:.3s}
  #siteHeader.scrolled{background:rgba(7,7,9,.94);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06)}
  .nav-left{display:flex;align-items:center;gap:28px}
  .logo{font-weight:900;font-size:26px;letter-spacing:.5px;color:var(--red);text-decoration:none}
  .nav-links{display:flex;gap:18px;list-style:none}
  .nav-links a{color:#ccc;font-size:13px;font-weight:700;text-decoration:none;transition:.2s}
  .nav-links a:hover{color:#fff}
  .nav-right{display:flex;align-items:center;gap:16px}
  #search{background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:13px;width:260px;padding:9px 38px 9px 12px;outline:none;border-radius:4px;font-family:'Cairo',sans-serif;font-weight:600}
  #search::placeholder{color:#888}
  #search:focus{border-color:#fff;background:#000;width:300px}
  .avatar{width:30px;height:30px;border-radius:4px;background:var(--red);display:grid;place-items:center;font-weight:900;font-size:11px}
  .billboard{position:relative;width:100%;height:88vh;min-height:560px;max-height:860px;overflow:hidden;background:#000}
  .hero-slide{position:absolute;inset:0;opacity:0;transition:opacity .8s ease, transform 8s ease;transform:scale(1.03);pointer-events:none}
  .hero-slide.active{opacity:1;transform:scale(1);pointer-events:auto;z-index:1}
  .hero-bg{position:absolute;inset:0;background-size:cover;background-position:center top}
  .hero-slide::before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(270deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.75) 28%,rgba(0,0,0,.25) 62%,transparent 88%),linear-gradient(0deg,var(--black) 0%,rgba(10,10,10,.6) 30%,transparent 70%),linear-gradient(180deg,rgba(0,0,0,.5),transparent 25%)}
  .hero-content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:right;padding:0 3%;padding-top:70px;max-width:62%}
  .hero-eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .hero-eyebrow b{color:var(--red);font-size:18px;font-weight:900;letter-spacing:1px}
  .hero-eyebrow span{color:#bbb;font-size:12px;letter-spacing:.5px;font-weight:800}
  .hero-title{font-family:'Tajawal',sans-serif;font-size:clamp(28px,4.2vw,54px);font-weight:900;line-height:1.05;letter-spacing:-.5px;text-shadow:0 4px 20px rgba(0,0,0,.8);margin-bottom:14px;color:#fff}
  .hero-meta{display:flex;align-items:center;gap:10px;color:#fff;font-size:14px;font-weight:800;margin-bottom:14px;flex-wrap:wrap}
  .hero-meta .match{color:#46d369;font-weight:900}
  .hero-meta .maturity{border:1px solid rgba(255,255,255,.5);padding:1px 7px;font-size:11px;font-weight:900}
  .hero-desc{color:#d1d1d1;font-size:15px;line-height:1.85;font-weight:600;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:560px;margin-bottom:22px;text-shadow:0 2px 10px rgba(0,0,0,.7)}
  .hero-actions{display:flex;gap:10px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 26px;border-radius:4px;font-size:15px;font-weight:900;letter-spacing:.2px;border:none;cursor:pointer;transition:.2s;text-decoration:none;font-family:'Cairo',sans-serif}
  .btn-play{background:#fff;color:#000}
  .btn-play:hover{background:rgba(255,255,255,.8)}
  .btn-info{background:rgba(109,109,110,.7);color:#fff;backdrop-filter:blur(2px)}
  .btn-info:hover{background:rgba(109,109,110,.4)}
  .hero-dots{position:absolute;left:3%;bottom:110px;z-index:5;display:flex;gap:8px;align-items:center}
  .hero-dot{width:22px;height:4px;border-radius:4px;background:rgba(255,255,255,.25);cursor:pointer;transition:.3s;border:none}
  .hero-dot.active{background:var(--red);width:32px;box-shadow:0 0 10px rgba(229,9,20,.5)}
  .hero-arrows{position:absolute;left:3%;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:10px}
  .hero-arrow{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.4);color:#fff;display:grid;place-items:center;cursor:pointer;transition:.2s;font-size:18px}
  .hero-arrow:hover{background:#fff;color:#000;border-color:#fff}
  .hero-counter{position:absolute;left:3%;bottom:135px;z-index:5;color:#888;font-size:11px;font-weight:800;letter-spacing:1px}
  .billboard-bottom-fade{position:absolute;left:0;right:0;bottom:0;height:35%;z-index:2;background:linear-gradient(0deg,var(--black) 0%,rgba(10,10,10,.9) 30%,transparent 100%);pointer-events:none}
  #chips{position:relative;z-index:4;display:flex;gap:8px;padding:14px 3%;background:var(--black);overflow-x:auto;scrollbar-width:none;border-bottom:1px solid rgba(255,255,255,.05)}
  #chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;padding:8px 18px;border-radius:20px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);color:#999;font-size:13px;font-weight:800;cursor:pointer;transition:.2s}
  .chip.active{background:#fff;color:#000;border-color:#fff}
  .chip:hover{color:#fff;border-color:rgba(255,255,255,.2)}
  #rows{padding:18px 0 40px}
  .row-section{margin-bottom:22px}
  .row-header{display:flex;align-items:center;gap:10px;padding:18px 3% 12px}
  .row-red-line{width:3px;height:18px;background:var(--red);border-radius:3px;box-shadow:0 0 10px rgba(229,9,20,.4)}
  .row-title{font-size:18px;font-weight:900;letter-spacing:-.2px}
  .row-count{font-size:11px;color:#555;font-weight:700;margin-right:auto}
  .row-track-wrap{position:relative}
  .row-track{display:flex;gap:14px;overflow-x:auto;padding:4px 3% 18px;scrollbar-width:none;scroll-behavior:smooth}
  .row-track::-webkit-scrollbar{display:none}
  .row-arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:70px;background:rgba(0,0,0,.6);border:none;color:#fff;font-size:30px;cursor:pointer;z-index:3;transition:.2s;backdrop-filter:blur(4px);display:none}
  .row-track-wrap:hover .row-arrow{display:grid;place-items:center}
  .row-arrow.left{left:0;border-radius:0 8px 8px 0}
  .row-arrow.right{right:0;border-radius:8px 0 0 8px}

  /* ===== NEW CARDS - RAIQ STYLE - FULL POSTER ===== */
  .card{
    position:relative;
    min-width:168px;
    width:168px;
    background:transparent;
    flex-shrink:0;
    cursor:pointer;
    transition:.35s cubic-bezier(.2,.8,.2,1);
    text-decoration:none;
  }
  .card-poster{
    width:100%;
    aspect-ratio:2/3.1;
    border-radius:12px;
    overflow:hidden;
    background:#121214;
    position:relative;
    box-shadow:0 8px 24px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.04) inset;
    transition:.35s cubic-bezier(.2,.8,.2,1);
  }
  .card-poster img{
    width:100%;
    height:100%;
    object-fit:cover; /* يبين البوستر كامل من غير قص الوجه */
    object-position:center top;
    display:block;
    background:#0f0f10;
    transition:.45s cubic-bezier(.2,.8,.2,1);
  }
  .card:hover{
    transform:translateY(-6px);
  }
  .card:hover .card-poster{
    box-shadow:0 18px 40px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.08) inset;
    transform:scale(1.03);
  }
  .card:hover .card-poster img{
    transform:scale(1.06);
    filter:brightness(1.08);
  }
  .card-badge-top{
    position:absolute;
    top:8px;
    right:8px;
    z-index:2;
    background:rgba(0,0,0,.68);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.12);
    color:#fff;
    font-size:10px;
    font-weight:900;
    padding:4px 9px;
    border-radius:20px;
    letter-spacing:.3px;
  }
  .card-badge-hd{
    position:absolute;
    top:8px;
    left:8px;
    z-index:2;
    background:#fff;
    color:#000;
    font-size:9px;
    font-weight:900;
    padding:3px 7px;
    border-radius:4px;
  }
  .card-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(0deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.15) 40%,transparent 70%);
    opacity:0;
    transition:.3s;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:14px;
  }
  .card:hover .card-overlay{opacity:1}
  .card-play{
    width:44px;
    height:44px;
    border-radius:50%;
    background:#fff;
    color:#000;
    display:grid;
    place-items:center;
    font-size:18px;
    box-shadow:0 8px 20px rgba(0,0,0,.4);
    transform:translateY(8px);
    transition:.35s cubic-bezier(.2,.8,.2,1);
  }
  .card:hover .card-play{transform:translateY(0)}
  .card-info{
    padding:10px 2px 0;
  }
  .card-title{
    font-size:13px;
    font-weight:800;
    line-height:1.3;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    color:#eaeaea;
  }
  .card:hover .card-title{color:#fff}
  .card-meta{
    font-size:11px;
    color:#7a7a7a;
    margin-top:3px;
    display:flex;
    gap:6px;
    align-items:center;
    font-weight:700;
  }
  .card-meta .year{color:#999}
  .card-meta .dot{width:3px;height:3px;background:#333;border-radius:50%}
  @media(max-width:600px){
    .card{min-width:132px;width:132px}
    .card-poster{border-radius:10px}
  }

  /* === زرارين تليجرام وواتساب === */
  #socialBar{
    position:relative;
    z-index:4;
    display:flex;
    gap:12px;
    padding:18px 3%;
    background:linear-gradient(180deg, rgba(10,10,10,.9), var(--black));
    border-bottom:1px solid rgba(255,255,255,.06);
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
  }
  .social-btn{
    flex:1;
    max-width:340px;
    min-width:160px;
    height:52px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-weight:900;
    font-size:14px;
    text-decoration:none;
    transition:.25s cubic-bezier(.2,.8,.2,1);
    border:1px solid rgba(255,255,255,.1);
  }
  .social-btn svg{width:22px;height:22px;flex-shrink:0}
  .social-btn.telegram{
    background:linear-gradient(135deg,#229ED9,#1a8ac0);
    color:#fff;
    border-color:rgba(34,158,217,.4);
    box-shadow:0 8px 20px rgba(34,158,217,.25);
  }
  .social-btn.whatsapp{
    background:linear-gradient(135deg,#25D366,#128C7E);
    color:#fff;
    border-color:rgba(37,211,102,.4);
    box-shadow:0 8px 20px rgba(37,211,102,.25);
  }
  .social-btn:hover{transform:translateY(-3px) scale(1.02);filter:brightness(1.1)}
  .social-label{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
  .social-label b{font-size:13px}
  .social-label small{font-size:10px;opacity:.8;font-weight:700;margin-top:1px}
  @media(max-width:600px){
    #socialBar{padding:14px 3%;gap:10px}
    .social-btn{height:48px;max-width:none}
  }
</style>
</head>

<script>
let ALL_MOVIES=[], HERO_MOVIES=[], heroIndex=0, heroTimer=null;
const $=id=>document.getElementById(id);
const MAIN_SECTIONS = [
  {id:'arabic_movies', label:'افلام عربية', keywords:['افلام عربي','افلام عربية']},
  {id:'foreign_movies', label:'افلام اجنبية', keywords:['افلام اجنبي','افلام اجنبية']},
  {id:'arabic_series', label:'مسلسلات عربية', keywords:['مسلسلات عربي','مسلسلات عربية']},
  {id:'foreign_series', label:'مسلسلات اجنبية', keywords:['مسلسلات اجنبي','مسلسلات اجنبية']},
];
const GENRES = ['اكشن','كوميدي','رعب','دراما','اثارة','تشويق واثارة','تشويق وإثارة','مغامرة','رومانسي','انمي'];

function getCats(m){return (m.category||'').split(',').map(s=>s.trim()).filter(Boolean);}
function isMainSection(cat){ return MAIN_SECTIONS.some(s=>s.keywords.includes(cat) || s.label===cat); }
function getSection(m){
  const cats=getCats(m);
  for(let sec of MAIN_SECTIONS){
    if(cats.some(c=>sec.keywords.includes(c) || sec.label===c)) return sec.label;
  }
  return cats.find(c=>isMainSection(c)) || '';
}
function getDisplayGenre(m){
  const cats=getCats(m);
  const genres = cats.filter(c=> !isMainSection(c));
  if(genres.length>0) return genres[0];
  return '';
}
function getTypeLabel(m){
  if(m.type === 'series') return 'مسلسل';
  if(m.type === 'movie') return 'فيلم';
  const sec = getSection(m);
  if(sec.includes('مسلسل')) return 'مسلسل';
  if(sec.includes('افلام')) return 'فيلم';
  if(m.episodes && m.episodes.length>0) return 'مسلسل';
  return 'فيلم';
}
function matchesSection(movie, sectionLabel){
  const secDef = MAIN_SECTIONS.find(s=>s.label===sectionLabel);
  if(!secDef) return false;
  const cats=getCats(movie);
  return cats.some(c=>secDef.keywords.includes(c) || secDef.label===c);
}

async function loadMovies(){
  try{
    let r=await fetch('./movies.json?v='+Date.now(),{cache:'no-store'});
    if(r.ok){
      let j=await r.json();
      let list=Array.isArray(j)?j:j.movies||[];
      if(list.length>0){ ALL_MOVIES=list; init(); return; }
    }
  }catch(e){}
  ALL_MOVIES=[
    {id:'1',title:'الكلاب السبعة',year:'2026',category:'اكشن, افلام عربية',type:'movie',poster:'https://images.unsplash.com/photo-1485846234645-a62644f84728?w=600',description:'تدور الاحداث حول خالد العزازي'},
  ];
  init();
}

function init(){
  HERO_MOVIES = ALL_MOVIES.slice(0,10);
  renderHeroSlider();
  renderChips();
  renderRows();
  setupHeaderScroll();
  setupSearch();
  startHeroAuto();
}

function renderHeroSlider(){
  const board=$('billboard');
  board.querySelectorAll('.hero-slide').forEach(e=>e.remove());
  HERO_MOVIES.forEach((m,i)=>{
    const img=m.poster_url||m.poster||m.image||'';
    const genre = getDisplayGenre(m);
    const typeLabel = getTypeLabel(m);
    const eyebrow = genre ? `${genre} • ${typeLabel}` : typeLabel;
    const seasonTxt = m.season ? ` • الموسم ${m.season}` : '';
    const slide=document.createElement('div');
    slide.className='hero-slide'+(i==0?' active':'');
    slide.innerHTML=`
      <div class="hero-bg" style="background-image:url('${img}')"></div>
      <div class="hero-content">
        <div class="hero-eyebrow"><b>G</b><span>${escapeHtml(eyebrow)}${seasonTxt}</span></div>
        <h1 class="hero-title">${escapeHtml(m.title||'')}</h1>
        <div class="hero-meta">
          <span class="match">98% Match</span>
          <span>${m.year||2026}</span>
          <span class="maturity">+16</span>
          <span>4K</span>
          <span>HDR</span>
        </div>
        <p class="hero-desc">${escapeHtml((m.description||'').slice(0,180))}</p>
        <div class="hero-actions">
          <a class="btn btn-play" href="movie.html?id=${m.id}">▶ تشغيل</a>
          <a class="btn btn-info" href="movie.html?id=${m.id}">ⓘ معلومات اكثر</a>
        </div>
      </div>
    `;
    board.insertBefore(slide, board.firstChild);
  });
  const dots=$('heroDots');
  dots.innerHTML=HERO_MOVIES.map((_,i)=>`<button class="hero-dot ${i==0?'active':''}" onclick="goHero(${i})"></button>`).join('');
  updateCounter();
}

function goHero(i){
  heroIndex=i;
  document.querySelectorAll('.hero-slide').forEach((el,idx)=>el.classList.toggle('active',idx==i));
  document.querySelectorAll('.hero-dot').forEach((el,idx)=>el.classList.toggle('active',idx==i));
  updateCounter();
  restartHeroAuto();
}
function heroNext(){ goHero((heroIndex+1)%HERO_MOVIES.length); }
function heroPrev(){ goHero((heroIndex-1+HERO_MOVIES.length)%HERO_MOVIES.length); }
function updateCounter(){ $('heroCounter').innerText=(heroIndex+1)+' / '+HERO_MOVIES.length; }
function startHeroAuto(){ heroTimer=setInterval(heroNext,5000); }
function restartHeroAuto(){ clearInterval(heroTimer); startHeroAuto(); }

function renderChips(){
  const chips=['الكل', ...MAIN_SECTIONS.map(s=>s.label)];
  $('chips').innerHTML=chips.map(c=>`<div class="chip ${c=='الكل'?'active':''}" onclick="filterCat(this,'${c.replace(/'/g,"\\'")}')">${c}</div>`).join('');
}
function filterCat(el,c){
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active')); el.classList.add('active');
  if(c=='الكل') renderRows();
  else renderRows(ALL_MOVIES.filter(m=>matchesSection(m,c)));
}

function renderRows(list=ALL_MOVIES){
  if(!list.length){ $('rows').innerHTML=`<div style="padding:40px 3%;color:#777">لا يوجد نتائج</div>`; return; }
  let html=`<div class="row-section"><div class="row-header"><div class="row-red-line"></div><h2 class="row-title">أحدث 10 إضافات</h2><span class="row-count">${Math.min(10,list.length)} عنوان</span></div><div class="row-track-wrap"><button class="row-arrow left" onclick="scrollRow(this,-1)">‹</button><div class="row-track">${list.slice(0,10).map(cardHtml).join('')}</div><button class="row-arrow right" onclick="scrollRow(this,1)">›</button></div></div>`;
  MAIN_SECTIONS.forEach(sec=>{
    let arr=list.filter(m=>matchesSection(m,sec.label));
    if(arr.length>0) html+=`<div class="row-section"><div class="row-header"><div class="row-red-line"></div><h2 class="row-title">${sec.label}</h2><span class="row-count">${arr.length}</span></div><div class="row-track-wrap"><button class="row-arrow left" onclick="scrollRow(this,-1)">‹</button><div class="row-track">${arr.map(cardHtml).join('')}</div><button class="row-arrow right" onclick="scrollRow(this,1)">›</button></div></div>`;
  });
  $('rows').innerHTML=html;
}
function cardHtml(m){
  const img=m.poster_url||m.poster||'';
  const genre=getDisplayGenre(m);
  const year=m.year||'';
  const typeLabel=getTypeLabel(m);
  return `<a class="card" href="movie.html?id=${m.id}">
    <div class="card-poster">
      <img loading="lazy" src="${img}" alt="${escapeHtml(m.title)}" onerror="this.src='https://via.placeholder.com/300x450/181818/666?text=GTM'">
      <div class="card-badge-top">${escapeHtml(genre || typeLabel)}</div>
      <div class="card-badge-hd">HD</div>
      <div class="card-overlay"><div class="card-play">▶</div></div>
    </div>
    <div class="card-info">
      <div class="card-title">${escapeHtml(m.title)}</div>
      <div class="card-meta"><span class="year">${year}</span><span class="dot"></span><span>${typeLabel}</span></div>
    </div>
  </a>`;
}
function scrollRow(btn,dir){ const track=btn.parentElement.querySelector('.row-track'); track.scrollBy({left: dir* (track.clientWidth*0.8), behavior:'smooth'}); }
function setupSearch(){ const input=$('search'); let t; input.addEventListener('input',()=>{ clearTimeout(t); t=setTimeout(()=>{ let q=input.value.trim().toLowerCase(); if(!q){renderRows(); return;} let f=ALL_MOVIES.filter(m=>(m.title||'').toLowerCase().includes(q)); renderRows(f); },220); }); }
function setupHeaderScroll(){ const h=$('siteHeader'); window.addEventListener('scroll',()=>{ if(window.scrollY>10) h.classList.add('scrolled'); else h.classList.remove('scrolled'); }); }
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
loadMovies();
