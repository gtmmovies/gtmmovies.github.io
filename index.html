<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTM MOVIES</title>
<link rel="preconnect" href="https://akkroydgqotbavvchiju.supabase.co">
<link rel="preconnect" href="https://wsrv.nl">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#050507;color:#fff}
header{position:fixed;top:0;width:100%;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:14px 4%;background:rgba(0,0,0,.6);backdrop-filter:blur(15px);border-bottom:1px solid rgba(255,255,255,.07)}
.logo{font-size:30px;font-weight:900;background:linear-gradient(90deg,#e50914,#ff3d5a);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.search input{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;padding:10px 18px;border-radius:30px;width:260px;outline:none}
.hero{height:92vh;position:relative;display:flex;align-items:center;padding:0 5%;overflow:hidden;background:#0a0a0a}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center top;transition:.5s}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#050507 15%,rgba(5,5,7,.6) 50%,transparent 85%),linear-gradient(0deg,#050507 10%,transparent 70%);z-index:1}
.hero-content{position:relative;z-index:2;max-width:650px}
.skeleton{animation:pulse 1.2s infinite;background:linear-gradient(90deg,#111,#1e1e1e,#111);background-size:200%}
@keyframes pulse{0%{background-position:-200% 0}100%{background-position:200% 0}}
.card{min-width:180px;width:180px;height:270px;border-radius:16px;overflow:hidden;background:#111;cursor:pointer;flex-shrink:0;border:1px solid rgba(255,255,255,.06);position:relative}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card:hover{transform:translateY(-6px) scale(1.02)}
.card .ov{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.9),transparent 60%);display:flex;flex-direction:column;justify-content:flex-end;padding:12px;opacity:0;transition:.3s}
.card:hover .ov{opacity:1}
.chips{padding:10px 4%;display:flex;gap:8px;overflow-x:auto;position:sticky;top:60px;z-index:5;background:rgba(5,5,7,.85);backdrop-filter:blur(10px)}
.chip{padding:8px 18px;border-radius:30px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);cursor:pointer;white-space:nowrap;transition:.2s}
.chip.active{background:#e50914;border-color:#e50914}
.row{padding:12px 0}.row h2{padding:0 4%;font-size:22px;margin-bottom:14px}
.slider{display:flex;gap:14px;overflow-x:auto;padding:10px 4% 20px;scrollbar-width:none}
.slider::-webkit-scrollbar{display:none}
</style>
</head><body>
<header><div class="logo">GTM MOVIES</div><div class="search"><input id="search" placeholder="ابحث..." oninput="doSearch()"></div></header>
<div class="hero" id="hero"><div class="hero-bg skeleton" id="heroBg"></div><div class="hero-content" id="heroContent"><h1 class="skeleton" style="height:60px;width:300px;border-radius:12px"></h1></div></div>
<div class="chips" id="chips"></div>
<div id="rows"><div class="slider"><div class="card skeleton"></div><div class="card skeleton"></div><div class="card skeleton"></div><div class="card skeleton"></div><div class="card skeleton"></div></div></div>
<script>
const supa=supabase.createClient('https://akkroydgqotbavvchiju.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFra3JveWRncW90YmF2dmNoaWp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MjY2MDcsImV4cCI6MjEwMjAwMjYwN30.lP10UuBAudqfOeoSpOkfHOXMR1Z24kY68CRNmKUcXpo');
let allMovies=[],currentCat='الكل';
const CACHE_KEY='gtm_cache_v2';const CACHE_TIME=10*60*1000;
function opt(u,w=400,h=600){if(!u)return '';try{if(u.includes('wsrv.nl'))return u;return `https://wsrv.nl/?url=${encodeURIComponent(u)}&w=${w}&h=${h}&fit=cover&output=webp&q=75`}catch(e){return u}}
function optHero(u){if(!u)return '';return `https://wsrv.nl/?url=${encodeURIComponent(u)}&w=900&output=webp&q=80`}
async function load(){
 let cached=localStorage.getItem(CACHE_KEY);
 if(cached){try{let c=JSON.parse(cached);if(Date.now()-c.time<CACHE_TIME&&c.data?.length){allMovies=c.data;build();}}catch(e){}}
 if(allMovies.length==0){
  let {data}=await supa.from('movies').select('*').order('id',{ascending:false}).limit(100);
  allMovies=data||[];
  if(allMovies.length) localStorage.setItem(CACHE_KEY,JSON.stringify({time:Date.now(),data:allMovies}));
  build();
 }
}
function build(){
 let cats=['الكل',...new Set(allMovies.map(m=>m.category||'افلام'))];
 document.getElementById('chips').innerHTML=cats.map(c=>`<div class="chip ${c==currentCat?'active':''}" onclick="filterCat('${c}')">${c}</div>`).join('');
 if(allMovies.length) showHero(allMovies[0]);
 render(allMovies);
}
function showHero(m){
 document.getElementById('heroBg').classList.remove('skeleton');
 document.getElementById('heroBg').style.backgroundImage=`url('${optHero(m.poster_url)}')`;
 document.getElementById('heroContent').innerHTML=`<div style="background:#e50914;display:inline-block;padding:4px 10px;border-radius:4px;font-size:12px;font-weight:800;margin-bottom:12px">${m.category||''}</div><h1 style="font-size:50px;font-weight:900;line-height:.95;margin-bottom:14px">${m.title}</h1><p style="color:#c9c9c9;line-height:1.7;font-size:15px;margin-bottom:24px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">${m.description||''}</p><a style="padding:14px 32px;border-radius:40px;background:#fff;color:#000;font-weight:800;text-decoration:none;display:inline-flex" href="movie.html?id=${m.id}">▶ شاهد</a>`;
}
function card(m){return `<div class="card" onclick="location.href='movie.html?id=${m.id}'"><img src="${opt(m.poster_url)}" loading="lazy" decoding="async" fetchpriority="low"><div class="ov"><b>${m.title}</b><small>${m.category||''}</small></div></div>`}
function render(list){
 let cats=[...new Set(list.map(m=>m.category||'افلام'))];
 let html=`<div class="row"><h2><span style="color:#e50914">#</span> احدث الاضافات</h2><div class="slider">${list.slice(0,10).map(card).join('')}</div></div>`;
 cats.forEach(cat=>{let arr=list.filter(m=>(m.category||'افلام')==cat); if(arr.length) html+=`<div class="row"><h2>🎬 ${cat}</h2><div class="slider">${arr.map(card).join('')}</div></div>`});
 document.getElementById('rows').innerHTML=html;
}
function filterCat(c){currentCat=c; document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.textContent==c)); if(c=='الكل') render(allMovies); else render(allMovies.filter(m=>(m.category||'افلام')==c)); window.scrollTo({top:500,behavior:'smooth'})}
function doSearch(){let q=document.getElementById('search').value.toLowerCase().trim();if(!q){render(allMovies);return}let f=allMovies.filter(m=>m.title.toLowerCase().includes(q)); document.getElementById('rows').innerHTML=`<div class="row"><h2>نتائج (${f.length})</h2><div class="slider" style="flex-wrap:wrap">${f.map(card).join('')}</div></div>`;}
load();
</script>
</body></html>
