<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTM Movies - مشاهدة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{font-family:'Cairo',sans-serif;box-sizing:border-box}
body{background:#080808;color:#fff;margin:0}
.nav{height:60px;background:#0e0e0e;border-bottom:1px solid #1f1f1f;display:flex;align-items:center;justify-content:space-between;padding:0 15px;position:sticky;top:0;z-index:100}
.nav b{color:#e50914;font-size:22px;cursor:pointer}
.nav a{color:#aaa;text-decoration:none;font-size:13px;background:#1a1a1a;padding:6px 12px;border-radius:20px;border:1px solid #222}
.container{max-width:1000px;margin:15px auto;padding:0 12px}
.player-wrap{position:relative;background:#000;border-radius:16px;overflow:hidden;border:1px solid #1f1f1f;aspect-ratio:16/9}
.player-wrap iframe,.player-wrap video{width:100%;height:100%;border:none;background:#000}
.servers{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;background:#111;padding:10px;border-radius:12px;border:1px solid #1f1f1f}
.server-btn{padding:8px 16px;border-radius:20px;border:1px solid #222;background:#1a1a1a;color:#aaa;cursor:pointer;font-size:13px;font-weight:600;transition:.2s}
.server-btn.active{background:#e50914;color:#fff;border-color:#e50914}
.server-btn:hover{border-color:#e50914;color:#fff}
.episodes-box{display:none;background:#111;padding:10px;border-radius:12px;border:1px solid #1f1f1f;margin:12px 0}
.episodes-box.show{display:block}
.episodes-head{font-size:13px;font-weight:800;color:#fff;margin-bottom:10px}
.episodes-list{display:flex;gap:8px;flex-wrap:wrap;max-height:220px;overflow-y:auto}
.ep-btn{min-width:52px;height:42px;border-radius:10px;border:1px solid #222;background:#1a1a1a;color:#bbb;cursor:pointer;font-size:13px;font-weight:800;display:grid;place-items:center}
.ep-btn.active{background:#fff;color:#000}
.info{background:#111;border:1px solid #1f1f1f;padding:18px;border-radius:16px;margin-top:12px}
.info h1{margin:0 0 6px 0;font-size:20px}
.meta{color:#777;font-size:12px;margin-bottom:10px}
.info p{color:#bbb;line-height:1.7;font-size:14px}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{padding:10px 16px;border-radius:10px;text-decoration:none;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn-back{background:#1a1a1a;color:#fff;border:1px solid #222}
.btn-dl{background:#e50914;color:#fff}
.btn-wa{background:#25D366;color:#fff}
</style>
</head>
<body>
<div class="nav"><b onclick="location.href='index.html'">GTM MOVIES</b><a href="index.html">الرئيسية</a></div>
<div class="container">
<div class="player-wrap" id="playerWrap"><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#666">جاري تحميل المشغل...</div></div>
<div class="episodes-box" id="episodesBox"><div class="episodes-head">الحلقات</div><div class="episodes-list" id="episodesList"></div></div>
<div class="servers" id="servers">
<button class="server-btn active" onclick="setServer(0)">سيرفر 1</button>
<button class="server-btn" onclick="setServer(1)">سيرفر 2</button>
<button class="server-btn" onclick="setServer(2)">احتياطي</button>
<button class="server-btn" onclick="setServer(3)">تحميل</button>
</div>
<div class="info"><h1 id="title">...</h1><div class="meta" id="meta"></div><p id="desc"></p><div class="actions"><a class="btn btn-back" href="index.html">رجوع</a><a class="btn btn-dl" id="dlBtn" href="#" target="_blank">تحميل</a></div></div>
</div>
<script>
const id = new URLSearchParams(window.location.search).get('id');
let movie=null, servers=[], currentEp=0;

function universalFix(url){
 if(!url) return '';
 url=url.trim();
 let yt=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([A-Za-z0-9_-]{11})/);
 if(yt){ return `https://www.youtube.com/embed/${yt[1]}?autoplay=1&rel=0&modestbranding=1&playsinline=1`; }
 if(url.includes('drive.google.com')){
  let m=url.match(/\/d\/([^\/]+)/);
  if(m) return `https://drive.google.com/file/d/${m[1]}/preview`;
 }
 if(url.includes('ok.ru') && url.includes('/video/')){
  let m=url.match(/\/video\/(\d+)/);
  if(m) return `https://ok.ru/videoembed/${m[1]}`;
 }
 let vm=url.match(/vimeo\.com\/(\d+)/);
 if(vm){ return `https://player.vimeo.com/video/${vm[1]}?autoplay=1`; }
 let dm=url.match(/dailymotion\.com\/video\/([A-Za-z0-9]+)/);
 if(dm){ return `https://www.dailymotion.com/embed/video/${dm[1]}?autoplay=1`; }
 return url;
}

function makePlayer(url){
 const wrap=document.getElementById('playerWrap'); wrap.innerHTML='';
 if(!url){ wrap.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#666">لا يوجد رابط</div>'; return; }
 url=universalFix(url);
 if(url.match(/\.(mp4|webm|m3u8)(\?|$)/i)){
  if(url.includes('.m3u8')){
   wrap.innerHTML=`<video id="hlsVideo" controls autoplay playsinline style="width:100%;height:100%"></video>`;
   let script=document.createElement('script');
   script.src='https://cdn.jsdelivr.net/npm/hls.js@latest';
   script.onload=()=>{
    let video=document.getElementById('hlsVideo');
    if(Hls.isSupported()){ let hls=new Hls(); hls.loadSource(url); hls.attachMedia(video); }
    else{ video.src=url; }
   };
   document.head.appendChild(script);
  }else{
   wrap.innerHTML=`<video controls autoplay playsinline src="${url}" style="width:100%;height:100%"></video>`;
  }
 }else{
  let ifr=document.createElement('iframe');
  ifr.src=url;
  ifr.allowFullscreen=true;
  ifr.allow='autoplay; fullscreen; encrypted-media; picture-in-picture';
  ifr.referrerPolicy='no-referrer';
  ifr.style.background='#000';
  wrap.appendChild(ifr);
 }
}

function buildServers(){
 let ep=movie.episodes?movie.episodes[currentEp]:null;
 let main=ep?(ep.video_url||movie.video_url):(movie.watch_url||movie.video_url||'');
 let u2=ep?(ep.video_url2||movie.video_url2):(movie.video_url2||'');
 servers=[main, u2||main, movie.video_url2||u2||main, movie.download_url||main];
}

function setServer(i){
 document.querySelectorAll('.server-btn').forEach((b,idx)=>b.classList.toggle('active',idx==i));
 makePlayer(servers[i]);
}

function playEp(i){
 currentEp=i; document.querySelectorAll('.ep-btn').forEach((b,idx)=>b.classList.toggle('active',idx==i));
 buildServers(); makePlayer(servers[0]);
 document.getElementById('title').innerText=movie.title+` - الحلقة ${i+1}`;
}

fetch('movies.json?t='+Date.now()).then(r=>r.json()).then(movies=>{
 let list=Array.isArray(movies)?movies:movies.movies||[];
 movie=list.find(m=>String(m.id)==String(id));
 if(!movie){document.getElementById('title').innerText='مش موجود';return;}
 document.getElementById('meta').innerText=(movie.category||'')+' • '+(movie.year||'');
 document.getElementById('desc').innerText=movie.description||'';
 document.title=movie.title+' - GTM';
 if(movie.episodes && movie.episodes.length>0){
  document.getElementById('episodesBox').classList.add('show');
  document.getElementById('episodesList').innerHTML=movie.episodes.map((e,i)=>`<button class="ep-btn ${i==0?'active':''}" onclick="playEp(${i})">${e.num||i+1}</button>`).join('');
 }
 buildServers();
 document.getElementById('dlBtn').href=movie.download_url||'#';
 document.getElementById('dlBtn').style.display=movie.download_url?'inline-flex':'none';
 makePlayer(servers[0]);
 document.getElementById('title').innerText=movie.title;
});
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
